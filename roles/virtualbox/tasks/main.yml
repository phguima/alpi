---
# VirtualBox (ported from AFPI/AAPI). Runs before roles/packages: the Oracle build signs its
# modules at install time (and at every boot with a new kernel), so its key must exist first. The
# packages come from the catalog (feature 'virtualbox').

- name: VirtualBox | Configure
  when: virtualbox_selected
  block:
    - name: VirtualBox | Prepare the Oracle module signing key (Secure Boot)
      when: is_secure_boot and not virtualbox_akmod
      block:
        - name: VirtualBox | Install signing tools
          ansible.builtin.package:
            name: [mokutil, openssl]
            state: present

        - name: VirtualBox | Create the MOK key directory
          ansible.builtin.file:
            path: "{{ virtualbox_mok_dir }}"
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: VirtualBox | Generate the MOK signing key pair
          ansible.builtin.command:
            cmd: >-
              openssl req -nodes -new -x509 -newkey rsa:2048 -days 36500 -outform DER
              -addext extendedKeyUsage=codeSigning
              -subj "/CN={{ ansible_facts['hostname'] }} VirtualBox module signing/"
              -keyout {{ virtualbox_mok_dir }}/MOK.priv -out {{ virtualbox_mok_dir }}/MOK.der
            creates: "{{ virtualbox_mok_dir }}/MOK.priv"

        - name: VirtualBox | Restrict the private key
          ansible.builtin.file:
            path: "{{ virtualbox_mok_dir }}/MOK.priv"
            owner: root
            group: root
            mode: '0600'

        - name: VirtualBox | Enroll the Oracle key
          ansible.builtin.include_role:
            name: akmods_mok
            tasks_from: enroll
          vars:
            mok_key_der: "{{ virtualbox_mok_dir }}/MOK.der"
            mok_key_label: VirtualBox

    # The packages create vboxusers too; creating both first lets the user join before the install.
    - name: VirtualBox | Ensure the vboxusers and vboxsf groups exist
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      loop: [vboxusers, vboxsf]

    - name: VirtualBox | Add the user to vboxusers and vboxsf
      ansible.builtin.user:
        name: "{{ user_name }}"
        groups: [vboxusers, vboxsf]
        append: true
      when: user_name != 'root'

    # Since kernel 6.12 kvm turns VT-x/AMD-V on when it loads (enable_virt_at_load=Y), even with
    # no KVM guest, and VirtualBox then fails (VERR_VMX_IN_VMX_ROOT_MODE, VERR_SVM_IN_USE on AMD).
    # With 0, KVM still works and holds it only while a guest runs. VirtualBox 7.2 shares VT-x
    # with KVM only on kernels 6.16+ (not EL10's 6.12) and not AMD-V, so it is set everywhere.
    # Installed systems have /etc/modprobe.d (kmod); a minimal one may not yet.
    - name: VirtualBox | Ensure /etc/modprobe.d exists
      ansible.builtin.file:
        path: "{{ virtualbox_kvm_conf | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: VirtualBox | Let kvm leave VMX off until a KVM guest runs
      ansible.builtin.copy:
        dest: "{{ virtualbox_kvm_conf }}"
        content: |
          # Managed by ALPI (roles/virtualbox): VirtualBox and KVM share VT-x
          options kvm enable_virt_at_load=0
        owner: root
        group: root
        mode: '0644'
      register: _virtualbox_kvm_conf

    - name: VirtualBox | Note when the kvm setting applies
      ansible.builtin.debug:
        msg: >-
          {{ virtualbox_kvm_conf }} applies when kvm is next loaded: reboot, or with no KVM guest
          running, 'sudo modprobe -r kvm_intel kvm'.
      when: _virtualbox_kvm_conf is changed

- name: VirtualBox | Remove the kvm setting
  ansible.builtin.file:
    path: "{{ virtualbox_kvm_conf }}"
    state: absent
  when: not virtualbox_selected
