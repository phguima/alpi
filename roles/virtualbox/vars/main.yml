---
# VirtualBox was selected (feature on, available, not skipped), by catalog id: native names
# differ per distro (VirtualBox, VirtualBox-7.2, apt's virtualbox-7.2). How its modules are
# built: an akmod (Fedora, roles/akmods_mok holds the key) or Oracle's vboxdrv.sh (EL, the key below).
virtualbox_selected: "{{ 'virtualbox' in alpi_ids_selected }}"
virtualbox_akmod: "{{ 'akmod-VirtualBox' in (alpi_pkgs.native + alpi_pkgs_extra.native) }}"
# Oracle's vboxdrv.sh signs its modules with this key pair when Secure Boot is on
virtualbox_mok_dir: /var/lib/shim-signed/mok
# kvm module options for VirtualBox (VT-x sharing); removed when VirtualBox is not selected
virtualbox_kvm_conf: /etc/modprobe.d/alpi-kvm.conf
