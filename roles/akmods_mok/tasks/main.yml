---
# Secure Boot signing key for the modules akmods (Fedora) or DKMS (Debian) build, ported from
# AFPI's akmods key. Runs before roles/packages: the signer signs the modules as it builds them, so
# its key must exist before any package that builds one is installed. Only with Secure Boot, on a
# distro with a signer (kmod_signer, group_vars/os_*), and when one of its ids was selected
# (kmod_signers in group_vars/all/secureboot.yml). Idempotent; the enrollment itself is confirmed
# by hand in MokManager on the next boot.

- name: MOK | Prepare the module signing key
  when:
    - is_secure_boot
    - kmod_signer in kmod_signers
    - alpi_ids_selected | intersect(_signer.ids | default([])) | length > 0
  vars:
    _signer: "{{ kmod_signers[kmod_signer] | default({}) }}"
  block:
    - name: MOK | Install signing tools
      ansible.builtin.package:
        name: "{{ _signer.packages }}"
        state: present

    - name: MOK | Generate the {{ _signer.label }} signing key pair
      ansible.builtin.command:
        argv: "{{ _signer.generate }}"
        creates: "{{ _signer.key_der }}"

    - name: MOK | Enroll the {{ _signer.label }} key
      ansible.builtin.include_tasks: enroll.yml
      vars:
        mok_key_der: "{{ _signer.key_der }}"
        mok_key_label: "{{ _signer.label }}"
