---
# System update (ported from AFPI/AAPI's update role). Runs after roles/repos (the dnf plugins,
# CRB/EPEL and RPM Fusion, which AFPI/AAPI set up here) and before anything that builds kernel
# modules or installs packages. The upgrade and the reboot signals per family (RedHat.yml,
# Debian.yml), then the gate.

- name: Update | Upgrade on {{ ansible_facts['os_family'] }}
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"

# --- Reboot gate ---
# If the upgrade touched the kernel or core libraries, stop here: the rest must run on the new
# kernel (the NVIDIA and VirtualBox modules build against the running kernel, and kernel cleanup
# can only drop the old one once it is no longer running). alpi_reboot_needed comes from the
# family's tasks.
- name: Update | Stop until the system is rebooted
  when: alpi_reboot_needed | bool
  block:
    - name: Update | Ask for a reboot
      ansible.builtin.debug:
        msg:
          - "=================================================================="
          - "The system was updated and needs a REBOOT before continuing."
          - "Reboot, then run the same ansible-playbook command again:"
          - "the update step will pass and the rest of the setup will run."
          - "=================================================================="

    - name: Update | End the play for this host
      ansible.builtin.meta: end_host

# The upgrade may have brought a newer KWin: decide the cedilla workaround again for the roles
# after this one (a KWin upgrade needs a new login, not a reboot)
- name: Update | Cedilla decision with the upgraded KWin
  ansible.builtin.import_tasks: ../../../tasks/cedilla.yml
