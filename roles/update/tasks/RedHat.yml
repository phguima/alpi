---
# dnf (main.yml): dnf settings, full upgrade, then the reboot signals (alpi_reboot_needed).

- name: Update | Tune dnf
  ansible.builtin.lineinfile:
    path: /etc/dnf/dnf.conf
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }}={{ item.value }}"
  loop: "{{ dnf_config | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# nobest: an update that cannot be installed is held back instead of failing the run. RPM Fusion's
# freeworld builds pin their EPEL library's exact version (libheif-freeworld: libheif = X), so EPEL
# shipping the library first blocks it until RPM Fusion rebuilds; EL's dnf.conf has best=True.
- name: Update | Upgrade all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
    nobest: true

# Reboot signals: 'needs-restarting -r' comes from dnf5-plugins / dnf-plugins-core
# (alpi_dnf_plugins, roles/repos); rc 1 = reboot needed.
- name: Update | Check whether a reboot is required
  ansible.builtin.command: dnf needs-restarting -r
  register: _reboot_hint
  changed_when: false
  failed_when: _reboot_hint.rc not in [0, 1]
  check_mode: false

# needs-restarting compares install times with the boot time, which is wrong when the RTC keeps
# local time (dual boot with Windows): on noir it returned 0 right after a kernel upgrade.
# Comparing the running kernel with the newest installed one needs no clock.
- name: Update | Find the newest installed kernel
  ansible.builtin.shell: set -o pipefail; rpm -qa kernel-core --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' | sort -V | tail -n 1
  args:
    executable: /bin/bash
  register: _newest_kernel
  changed_when: false
  check_mode: false

- name: Update | Reboot signals
  ansible.builtin.set_fact:
    alpi_reboot_needed: >-
      {{ _reboot_hint.rc == 1 or
         (_newest_kernel.stdout | length > 0 and _newest_kernel.stdout != ansible_facts['kernel']) }}
