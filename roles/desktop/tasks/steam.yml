---
# Steam's own launcher runs it on the NVIDIA GPU: it sets PrefersNonDefaultGPU and
# X-KDE-RunOnDiscreteGpu, and the desktop applies switcheroo-control's offload variables (checked
# on noir, 2026-10-25: every Steam process had them and nvidia-smi listed Steam). The user copy
# with the PRIME variables on every Exec that AFPI (and ALPI until then) wrote only shadows Steam's
# updates, and without the NVIDIA driver __GLX_VENDOR_LIBRARY_NAME=nvidia breaks Steam's OpenGL:
# a user launcher that carries the offload goes. Any other steam.desktop is the user's own.

- name: Steam | Read the user's launcher
  ansible.builtin.slurp:
    src: "{{ user_home }}/.local/share/applications/steam.desktop"
  register: _steam_user
  failed_when: false

- name: Steam | Remove the launcher with the PRIME offload
  ansible.builtin.file:
    path: "{{ user_home }}/.local/share/applications/steam.desktop"
    state: absent
  when: "'Exec=env __NV_PRIME_RENDER_OFFLOAD=1 ' in (_steam_user.content | default('') | b64decode)"
