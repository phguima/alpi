---
# The user's desktop settings (ported from AFPI/AAPI's desktop role, plus the workspace
# directory from their common role). Skipped when the playbook runs as root without sudo: there is
# no user session to configure.

- name: Desktop | User settings
  when: user_name != 'root'
  block:
    - name: Desktop | Workspace directory
      ansible.builtin.file:
        path: "{{ workspace_dir }}"
        state: directory
        mode: "0755"
      become_user: "{{ user_name }}"
      tags: [workspace]

    - name: Desktop | Konsole (KDE)
      ansible.builtin.import_tasks: konsole.yml
      when: is_kde
      tags: [konsole]

    # GNOME's terminal on Fedora and Ubuntu; Debian's GNOME has gnome-terminal, and gsettings
    # fails on a schema that is not installed
    - name: Desktop | Look for Ptyxis
      ansible.builtin.stat:
        path: /usr/share/glib-2.0/schemas/org.gnome.Ptyxis.gschema.xml
      register: _ptyxis_schema
      when: is_gnome
      tags: [ptyxis]

    - name: Desktop | Ptyxis (GNOME)
      ansible.builtin.import_tasks: ptyxis.yml
      when: is_gnome and _ptyxis_schema.stat.exists
      tags: [ptyxis]

    - name: Desktop | Cedilla
      ansible.builtin.import_tasks: cedilla.yml
      tags: [cedilla]

    - name: Desktop | Cedilla, menu entries on XWayland (KDE with an older KWin)
      ansible.builtin.import_tasks: xwayland.yml
      tags: [cedilla]

    - name: Desktop | Steam on the NVIDIA GPU (a launcher copy where Steam's own does not ask)
      ansible.builtin.import_tasks: steam.yml
      tags: [steam]
