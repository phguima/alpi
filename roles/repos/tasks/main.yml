---
# Enables alpi_repos_enabled (tasks/resolve.yml) in order: the distro's always-on repositories,
# then the ones the selected packages need. dnf (RedHat.yml) or apt (Debian.yml).
- name: Repos | Repositories for {{ ansible_facts['os_family'] }}
  ansible.builtin.include_tasks: "{{ ansible_facts['os_family'] }}.yml"
