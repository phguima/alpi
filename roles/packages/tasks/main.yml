---
# Installs the sets resolved in tasks/resolve.yml: the base first, the user's extras in a separate
# step, then the explicit uninstalls.

# Name checks first (check.yml): nothing is installed before every name is known to exist.
- name: Packages | Check that every package exists
  ansible.builtin.include_tasks: check.yml

# Replacements first (catalog 'swap: true', e.g. ffmpeg-free -> ffmpeg), so the base install
# below finds them in place. dnf only: no other package manager is supported yet.
- name: Packages | Install replacement packages (allowerasing)
  ansible.builtin.dnf:
    name: "{{ alpi_pkgs.swap }}"
    state: present
    allowerasing: true
  when: alpi_pkgs.swap | length > 0

- name: Packages | Install base packages
  ansible.builtin.package:
    name: "{{ alpi_pkgs.native }}"
    state: present
  when: alpi_pkgs.native | length > 0

- name: Packages | Install base flatpaks
  community.general.flatpak:
    name: "{{ alpi_pkgs.flatpak }}"
    remote: flathub
    state: present
  when: alpi_pkgs.flatpak | length > 0

- name: Packages | Install the user's extra packages
  ansible.builtin.package:
    name: "{{ alpi_pkgs_extra.native }}"
    state: present
  when: alpi_pkgs_extra.native | length > 0

- name: Packages | Install the user's extra flatpaks
  community.general.flatpak:
    name: "{{ alpi_pkgs_extra.flatpak }}"
    remote: flathub
    state: present
  when: alpi_pkgs_extra.flatpak | length > 0

# packages_absent only. No autoremove: dependencies other packages may need are kept.
- name: Packages | Remove packages listed in packages_absent
  ansible.builtin.package:
    name: "{{ alpi_pkgs_absent.native }}"
    state: absent
  when: alpi_pkgs_absent.native | length > 0

- name: Packages | Remove flatpaks listed in packages_absent
  community.general.flatpak:
    name: "{{ alpi_pkgs_absent.flatpak }}"
    state: absent
  when: alpi_pkgs_absent.flatpak | length > 0

# Overrides for the selected apps (tasks/resolve.yml), written to the user's
# ~/.local/share/flatpak/overrides/<app>. 'flatpak override' merges into that file, so the task
# reports a change only when the file differs afterwards.
- name: Packages | Apply Flatpak overrides
  ansible.builtin.shell:
    cmd: |
      set -e
      set -- {{ ([item.app] + item.flags) | map('quote') | join(' ') }}
      app=$1; shift
      file="$XDG_DATA_HOME/flatpak/overrides/$app"
      before=$(cat "$file" 2>/dev/null || true)
      flatpak override --user "$@" "$app"
      [ "$before" = "$(cat "$file" 2>/dev/null)" ] || echo ALPI_CHANGED
  environment:
    HOME: "{{ user_home }}"
    XDG_DATA_HOME: "{{ user_home }}/.local/share"
  become_user: "{{ user_name }}"
  loop: "{{ alpi_flatpak_overrides }}"
  loop_control:
    label: "{{ item.app }}"
  register: _flatpak_override
  changed_when: "'ALPI_CHANGED' in _flatpak_override.stdout"
  tags: [flatpak]
