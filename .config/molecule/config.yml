---
# Base config for every scenario in molecule/ (Molecule loads it automatically). Scenarios only
# declare their platform; their settings under test live in molecule/<scenario>/host_vars/.
driver:
  name: podman
provisioner:
  name: ansible
  # Molecule writes its own ansible.cfg (ANSIBLE_CONFIG), so the repo's is not read here, and its
  # pipelining sits under [ssh_connection], which the podman connection ignores. Pipelining sends
  # each module through podman exec's stdin instead of copying it in first: about a third faster
  # (memory: 3m25s -> 2m15s, 2026-10-23).
  config_options:
    connection:
      pipelining: true
  options:
    # Hardware is pinned, never detected: lspci in a rootless container sees the host's PCI
    # devices once pciutils gets installed. Extra vars win over set_fact. A scenario that sets its
    # own extra-vars replaces this string, so it must list all four.
    extra-vars: '{"is_nvidia": false, "is_asus": false, "is_intel": false, "is_amd": false}'
  env:
    # site.yml targets localhost unless this is set; molecule/shared/converge.yml checks it
    ALPI_TARGET: all
    ANSIBLE_FILTER_PLUGINS: ${MOLECULE_PROJECT_DIRECTORY}/filter_plugins
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    # The repo's group_vars (so playbooks outside the repo root, like verify.yml, see them) and
    # the scenario's host_vars (the custom.yml settings under test). Links replace inline host_vars.
    links:
      group_vars: ../../group_vars/
      host_vars: host_vars/
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
verifier:
  name: ansible
scenario:
  test_sequence: [destroy, syntax, create, prepare, converge, idempotence, verify, destroy]
