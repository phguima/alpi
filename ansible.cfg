[defaults]
inventory = inventory.ini
interpreter_python = /usr/bin/python3
inject_facts_as_vars = False
# Longer timeout for slow tasks
timeout = 30
# Avoids problems when swapping temporary files
remote_tmp = /tmp/.ansible-${USER}/tmp

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = True

[ssh_connection]
# Pipelining cuts the number of SSH operations and speeds up runs,
# even on local connections, which helps keep the session alive.
pipelining = True
