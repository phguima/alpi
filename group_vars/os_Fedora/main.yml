---
alpi_catalog_keys: [fedora, rpm, all]
packages_os: [multimedia]

# MOK enrollment password (see group_vars/all/secureboot.yml)
mok_password: "fedora-alpi"
# akmods builds and signs the NVIDIA and VirtualBox modules (roles/akmods_mok)
kmod_signer: akmods

# dnf5's needs-restarting says whether to reboot by default (-r is accepted but does nothing)
zsh_aliases_os:
  full-update:
    cmd: "flatpak update -y; {{ zsh_full_update_tools }}sudo dnf upgrade --refresh -y; dnf needs-restarting"
    description: Update the flatpaks, the AI tools and the system

# DNF plugins (config-manager, copr, needs-restarting), installed first by roles/repos
alpi_dnf_plugins: [dnf-plugins-core, dnf5-plugins]

# RPM Fusion is always on (codecs, Steam, Discord, NVIDIA…); see group_vars/all/repos.yml.
alpi_repos_always: [rpmfusion-free, rpmfusion-nonfree]
alpi_repos_os:
  rpmfusion-free:
    type: rpm
    url: "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
  rpmfusion-nonfree:
    type: rpm
    url: "https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
  asus-linux:
    type: copr
    name: lukenukem/asus-linux
