---
alpi_catalog_keys: [el10, el, all]
packages_os: []

# dnf4: without -r, needs-restarting lists processes instead of saying whether to reboot
zsh_aliases_os: |
  alias full-update="flatpak update -y; sudo npm update -g; sudo dnf upgrade --refresh -y; dnf needs-restarting -r"

# DNF plugins (config-manager, copr, needs-restarting), installed first by roles/repos
alpi_dnf_plugins: [dnf-plugins-core]

# CRB + EPEL before anything else: most desktop packages live in EPEL, and RPM Fusion for EL
# depends on it.
alpi_repos_always: [crb, epel, rpmfusion-free, rpmfusion-nonfree]
alpi_repos_os:
  crb:
    type: dnf_config
  epel:
    type: package
    name: epel-release
  rpmfusion-free:
    type: rpm
    url: "https://mirrors.rpmfusion.org/free/el/rpmfusion-free-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
  rpmfusion-nonfree:
    type: rpm
    url: "https://mirrors.rpmfusion.org/nonfree/el/rpmfusion-nonfree-release-{{ ansible_facts['distribution_major_version'] }}.noarch.rpm"
  # VirtualBox is not packaged for EL10 (catalog: virtualbox)
  virtualbox:
    type: yum
    description: Oracle VirtualBox
    baseurl: "https://download.virtualbox.org/virtualbox/rpm/el/{{ ansible_facts['distribution_major_version'] }}/$basearch"
    gpgkey: https://www.virtualbox.org/download/oracle_vbox_2016.asc
    repo_gpgcheck: true
