---
# roles/desktop: the user's workspace, terminal settings and the cedilla fix (ported from
# AFPI/AAPI's desktop role). Konsole on KDE, Ptyxis on GNOME.

workspace_dir: "{{ user_home }}/wks"

# Konsole (KDE): profile and color scheme from roles/desktop/files, settings in ~/.config/konsolerc
konsole_profile: kali-like-alt
konsole_settings:
  - { section: KonsoleWindow, option: RememberWindowSize, value: "false" }
  - { section: Desktop Entry, option: DefaultProfile, value: "kali-like-alt.profile" }
  - { section: TabBar, option: ExpandTabWidth, value: "true" }

# Ptyxis (GNOME): gsettings keys, and dconf keys (values in GVariant syntax)
ptyxis_gsettings:
  restore-window-size: "false"
  default-columns: 120
  default-rows: 35
ptyxis_dconf:
  cursor-shape: "'underline'"
  cursor-blink-mode: "'on'"
  use-system-font: "false"
  font-name: "'Fira Code 10'"
# Default profile's opacity (only once Ptyxis has created its default profile)
ptyxis_opacity: 0.95

# PRIME render offload: what runs a program on the NVIDIA GPU of a hybrid laptop (the nvidia-run
# alias in group_vars/all/zsh.yml; Steam needs none, see roles/desktop/tasks/steam.yml)
nvidia_prime_env: "__NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia __NV_PRIME_RENDER_OFFLOAD_PROVIDER=NVIDIA-G0"

# Cedilla on KDE (ported from AAPI): under KWin 6.6 (EL10; Fedora 44 before its 6.7 update),
# Chromium/Electron apps on native Wayland ignore ~/.XCompose and type "ć". On XWayland they read
# it through GTK, so on such a KWin they run on X11 (resolved into alpi_cedilla_xwayland by
# tasks/cedilla.yml from the installed KWin, again after roles/update's upgrade):
#   cedilla_xwayland: auto (KWin older than cedilla_xwayland_kwin_below) | true | false, on KDE
#   only; set it in custom.yml to force it. Everything below is undone when it no longer applies.
cedilla_xwayland: auto
cedilla_xwayland_kwin_below: "6.7"
cedilla_ozone_flag: --ozone-platform=x11
# System menu entries (/usr/share/applications) copied to ~/.local/share/applications (the copy
# wins) with the flag on every Exec line, rebuilt on every run so updates reach them; a copy of
# the user's own only gets the flag. VS Code's argv.json does not accept ozone-platform, hence its
# entries here too. Antigravity's entry (roles/ai_tools) and the antigravity-ide and code aliases
# (group_vars/all/zsh.yml) get the flag directly. The Flatpak apps: group_vars/all/flatpak.yml.
cedilla_x11_desktop_entries:
  - brave-browser.desktop
  - brave-origin.desktop
  - com.brave.Browser.desktop
  - com.brave.Origin.desktop
  - com.microsoft.VSCode.desktop
  - com.microsoft.VSCode.UrlHandler.desktop
cedilla_x11_desktop_marker: "ALPI: copy of the system entry on XWayland for the cedilla (cedilla_xwayland), rebuilt on every run"
