---
# Zsh + Oh My Zsh (roles/zsh, ported from AFPI/AAPI). Runs only when the 'zsh' catalog id is
# selected. Aliases go in a managed block of each .zshrc:
#   zsh_aliases (here) + zsh_aliases_family (per family, group_vars/family_*) + zsh_aliases_os
#     (per distro, group_vars/os_*), the later layer winning a name: name -> definition, each
#     listed by pick.py and on unless switched off by name: zsh_aliases_selection (pick.py,
#     selection.yml) then zsh_aliases_enabled (custom.yml), {name: bool}
#   zsh_aliases_cedilla: user only, part of the cedilla workaround (not a choice)
#   luks_volumes, zsh_aliases_custom: the machine's own (host_vars/127.0.0.1/custom.yml)
omz_install_script_url: "https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh"
omz_theme_name: "kali-like-alt"
# zsh-autosuggestions and zsh-syntax-highlighting are handled by the kali-like-alt theme itself.
omz_plugins:
  - git

# A definition: cmd (written as alias <name>='<cmd>'), description (the picker's label), root:
# true to write it to root's .zshrc too (otherwise the user's only), requires: a catalog id or
# feature the alias runs, without which it is left out even when on. A name must not be a catalog
# id or feature (the picker toggles them all by name; tests/unit/test_pick.py checks).
# antigravity-ide, not antigravity: the Antigravity CLI's shell setup deletes any
# 'alias antigravity=' line (antigravity_ide_dir is in group_vars/all/ai_tools.yml). With the
# cedilla workaround (alpi_cedilla_xwayland), the IDE starts on XWayland from the shell too.
zsh_aliases:
  zshconfig:
    cmd: nano ~/.zshrc
    description: Edit .zshrc
    root: true
  ohmyzsh:
    cmd: nano ~/.oh-my-zsh
    description: Open Oh My Zsh's directory
    root: true
  lls:
    cmd: ls --color -lh --group-directories-first
    description: Long listing, folders first
    root: true
  llsa:
    cmd: ls --color -lha --group-directories-first
    description: Long listing with hidden files, folders first
    root: true
  clean-cache:
    cmd: sudo sync; echo 3 | sudo tee /proc/sys/vm/drop_caches
    description: Drop the page cache
    root: true
  claudecli:
    cmd: cd ~/wks; clear; claude
    description: Claude Code in ~/wks
    requires: claude_code
  agycli:
    cmd: cd ~/wks; clear; agy
    description: Antigravity CLI in ~/wks
    requires: antigravity_cli
  antigravity-ide:
    cmd: "\"{{ antigravity_ide_dir }}/antigravity\"{{ (' ' ~ cedilla_ozone_flag) if alpi_cedilla_xwayland | default(false) else '' }}"
    description: Antigravity IDE from the shell
    requires: antigravity_ide
  nvidia-run:
    cmd: "{{ nvidia_prime_env }}"
    description: Run a program on the NVIDIA GPU
    requires: nvidia-driver

# VS Code on XWayland from the shell, with the cedilla workaround (group_vars/all/desktop.yml)
zsh_aliases_cedilla: |
  {% if alpi_cedilla_xwayland | default(false) and 'vscode' in alpi_ids_selected | default([]) %}
  alias code='code {{ cedilla_ozone_flag }}'
  {% endif %}

# Updaters that full-update (zsh_aliases_os/_family) runs between Flatpak and dnf/apt, in this order: command
# -> its update, each only when the command is in PATH at that moment (installed by ALPI or not,
# removed later; nodejs can be skipped). The Antigravity IDE has no updater outside the app.
zsh_full_update_cmds:
  npm: sudo npm update -g
  claude: claude update
  agy: agy update
zsh_full_update_tools: "{% for cmd, update in zsh_full_update_cmds.items() %}command -v {{ cmd }} >/dev/null && {{ update }}; {% endfor %}"

# API key exports for the user's .zshrc come from api_keys in the optional vault
# group_vars/all/secrets.yml (see README). Not defaulted here: files in group_vars/all load in
# alphabetical order, so a default in this file would override secrets.yml.

# The machine's own (custom.yml). luks_volumes: name -> LUKS UUID (as in /dev/mapper/luks-<UUID>),
# giving open-<name> / close-<name> aliases that unlock+mount / unmount+lock it with udisksctl.
luks_volumes: {}
zsh_aliases_custom: ""
