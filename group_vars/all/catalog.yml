---
# Package catalog: logical id -> what to install on each distro.
# Keys are tried in the order of alpi_catalog_keys (group_vars/os_*), most specific first:
#   Fedora: fedora, all        AlmaLinux 10: el10, el, all
# Values: a native package name, a list of names, {flatpak: <app id>}, {pipx: <PyPI spec>} (a
# Python app installed for the user by roles/pipx; extras allowed: "markitdown[all]"),
# {upstream: <source id>} (from the vendor's own releases, group_vars/all/upstream.yml), or ~
# (unavailable: the id is skipped with a warning). 'repo:' names the repository (group_vars/all/repos.yml) the native
# packages come from when it is not always on; roles/repos enables it only when needed.
# 'swap: true' marks a package that replaces a conflicting one (ffmpeg-free -> ffmpeg): roles/packages
# installs it first, with allowerasing. Native names may be dnf groups ('@multimedia').
# A per-distro value {native: <name or list>, repo: <id>} names a repository only that distro
# needs (it replaces the entry's 'repo:').
# An id with no key for the current distro is a catalog bug and stops the run, so every id must
# cover every supported distro (or use 'all'). The 'catalog' Molecule scenario checks that every
# name exists on every supported distro.
alpi_catalog:
  # --- Command line and system tools ---
  7zip:          {all: [7zip, 7zip-standalone]}   # Fedora 44: p7zip and p7zip-plugins are only provides of these
  curl:          {all: curl}
  fastfetch:     {all: fastfetch}
  git:           {all: git}
  htop:          {all: htop}
  hwinfo:        {all: hwinfo}
  imagemagick:   {all: ImageMagick}                 # EPEL on EL
  lm-sensors:    {all: lm_sensors}
  nodejs:        {all: nodejs}
  nvtop:         {all: nvtop}
  pipx:          {all: pipx}
  potrace:       {all: potrace}                     # EPEL on EL
  python3-pip:   {all: python3-pip}
  shellcheck:    {all: ShellCheck}
  testdisk:      {all: testdisk}
  tmux:          {all: tmux}
  tuptime:       {all: tuptime}
  unrar:         {all: unrar}
  unzip:         {all: unzip}
  uv:            {all: uv}
  vim:           {fedora: vim, el: vim-enhanced}
  zsh:           {all: zsh}

  # --- Security ---
  chkrootkit:    {fedora: chkrootkit, el: ~}
  clamav:        {all: clamav}
  clamav-freshclam: {fedora: clamav-update, el: clamav-freshclam}
  lynis:         {all: lynis}
  rkhunter:      {all: rkhunter}
  unhide:        {fedora: unhide, el: ~}

  # --- Desktop applications ---
  argyllcms:     {fedora: argyllcms, el: ~}
  brave:         {all: [brave-browser, brave-origin], repo: brave-browser}
  chromium:      {all: chromium}
  discord:       {all: discord}                   # RPM Fusion nonfree
  drawy:         {fedora: drawy, el: {flatpak: org.kde.drawy}}
  gh:            {all: gh, repo: gh-cli}
  inkscape:      {fedora: inkscape, el: {flatpak: org.inkscape.Inkscape}}
  steam:         {fedora: steam, el: ~}
  telegram:      {fedora: telegram-desktop, el: {flatpak: org.telegram.desktop}}
  vscode:        {all: code, repo: code}
  # Fixed source per distro (PROPOSAL decision 5): RPM Fusion's akmod on Fedora (named, so
  # roles/akmods_mok sees it), Oracle's repository on EL with the module build tools it needs.
  # kernel-devel is named on Fedora: akmods needs a kernel-devel-uname-r provider, and without an
  # installed kernel (containers) dnf picks kernel-debug-devel, which roles/boot then removes.
  virtualbox:    {fedora: [VirtualBox, akmod-VirtualBox, kernel-devel],
                  el: {native: [VirtualBox-7.2, kernel-devel, gcc, make, elfutils-libelf-devel], repo: virtualbox}}

  # --- Python apps (pipx, for the user; roles/pipx) ---
  markitdown:          {all: {pipx: "markitdown[all]"}}         # documents to Markdown
  notebooklm-py:       {all: {pipx: "notebooklm-py[browser]"}}  # + Playwright and Chromium (roles/pipx)
  pdf2docx:            {all: {pipx: pdf2docx}}

  # --- Flatpaks ---
  bitwarden:           {all: {flatpak: com.bitwarden.desktop}}
  displaycal:          {all: {flatpak: net.displaycal.DisplayCAL}}
  gpu-screen-recorder: {all: {flatpak: com.dec05eba.gpu_screen_recorder}}
  slack:               {all: {flatpak: com.slack.Slack}}
  spotify:             {all: {flatpak: com.spotify.Client}}
  zapzap:              {all: {flatpak: com.rtosta.zapzap}}
  zoom:                {all: {flatpak: us.zoom.Zoom}}
  zotero:              {all: {flatpak: org.zotero.Zotero}}

  # --- GNOME ---
  extension-manager:   {all: {flatpak: com.mattjakeman.ExtensionManager}}
  flatseal:            {all: flatseal}
  fragments:           {all: {flatpak: de.haeckerfelix.Fragments}}
  gnome-tweaks:        {all: gnome-tweaks}
  video-downloader:    {all: {flatpak: com.github.unrud.VideoDownloader}}

  # --- KDE ---
  kde-gtk-config:      {all: kde-gtk-config}
  kpat:                {fedora: kpat, el: {flatpak: org.kde.kpat}}   # Fedora KDE ships it already
  ktorrent:            {all: ktorrent}
  media-downloader:    {all: {flatpak: com.markopejic.downloader}}
  plasma-sdk:          {all: plasma-sdk}

  # --- Fonts ---
  fira-code-fonts:     {all: fira-code-fonts}           # EPEL on EL
  google-roboto-fonts: {fedora: google-roboto-fonts, el: {upstream: roboto}}  # not packaged for EL

  # --- Multimedia codecs (RPM Fusion) ---
  ffmpeg:              {all: ffmpeg, swap: true}         # replaces ffmpeg-free
  # RPM Fusion's @multimedia adds freeworld packages built against newer libraries than EPEL
  # ships, which breaks the transaction on EL: Fedora only (packages_os), not unavailable.
  multimedia:          {fedora: "@multimedia", el: ~}
  gstreamer1-plugins-bad-free-extras: {fedora: gstreamer1-plugins-bad-free-extras, el: ~}
  gstreamer1-plugins-bad-freeworld:   {all: gstreamer1-plugins-bad-freeworld}
  gstreamer1-plugins-ugly:            {all: gstreamer1-plugins-ugly}
  gstreamer1-plugin-libav:            {all: gstreamer1-plugin-libav}   # was gstreamer1-libav

  # --- Hardware (feature_packages) ---
  # Video acceleration. EL10's mesa has no VA-API drivers and no freeworld build exists for it.
  libva-intel-driver:  {all: libva-intel-driver}
  intel-media-driver:  {all: intel-media-driver}         # RPM Fusion nonfree
  mesa-va-drivers-freeworld: {fedora: mesa-va-drivers-freeworld, el: ~, swap: true}
  libva-utils:         {fedora: libva-utils, el: ~}
  vdpauinfo:           {fedora: vdpauinfo, el: ~}
  # NVIDIA proprietary driver (RPM Fusion nonfree akmod; roles/akmods_mok and roles/nvidia).
  nvidia-driver: {fedora: [akmod-nvidia, xorg-x11-drv-nvidia, xorg-x11-drv-nvidia-cuda,
                           xorg-x11-drv-nvidia-libs, xorg-x11-drv-nvidia-libs.i686], el: ~}
  nvidia-build:  {fedora: [akmods, kmodtool, gcc, kernel-devel, kernel-headers], el: ~}
  nvidia-vulkan: {fedora: [vulkan, xorg-x11-drv-nvidia-cuda-libs], el: ~}
  nvidia-vaapi:  {fedora: libva-nvidia-driver, el: ~}           # VA-API and NVENC/NVDEC
  asusctl:         {fedora: asusctl, el: ~, repo: asus-linux}
  supergfxctl:     {fedora: supergfxctl, el: ~, repo: asus-linux}
  asusctl-rog-gui: {fedora: asusctl-rog-gui, el: ~, repo: asus-linux}

# Renamed ids keep resolving: old id -> current id.
alpi_catalog_aliases:
  p7zip: 7zip
  lm_sensors: lm-sensors
  gstreamer1-libav: gstreamer1-plugin-libav
