---
# Features: items with their own configuration tasks, switched by a flag (never by removing a
# package name). Layers: features_default here, features_selection (host_vars/127.0.0.1/
# selection.yml, written by pick.py), features (host_vars/127.0.0.1/custom.yml, applied last).
# Unknown names stop the run.
# Hardware features take 'auto' (on when detected) or false (veto); they are never forced on.
alpi_hardware_features: [nvidia, asus, intel, amd]

features_default:
  nvidia: auto
  asus: auto
  intel: auto
  amd: auto
  steam: true
  clamav: true
  virtualbox: true
  # AI tools (roles/ai_tools): vendor installers for the user, no catalog packages
  claude_code: true
  antigravity_cli: true
  antigravity_ide: true

# Package ids (catalog) each feature adds to the base set while it is on.
feature_packages:
  steam: [steam]
  clamav: [clamav, clamav-freshclam]
  virtualbox: [virtualbox]
  asus: [asusctl, supergfxctl, asusctl-rog-gui]
  intel: [libva-intel-driver, intel-media-driver]
  amd: [mesa-va-drivers-freeworld, libva-utils, vdpauinfo]
  nvidia: [nvidia-driver, nvidia-build, nvidia-vulkan, nvidia-vaapi]

# What the picker shows for features that install no catalog packages (the others list theirs)
feature_descriptions:
  claude_code: Claude Code CLI (native installer, ~/.local/bin/claude)
  antigravity_cli: Antigravity CLI (native installer, ~/.local/bin/agy)
  antigravity_ide: Antigravity IDE (AppImage in ~/wks/tools/antigravity, menu entry)
