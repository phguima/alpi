---
# Debian 13 (PROPOSAL.md, "Decisions (2026-10-24)"). Not in the support matrix yet: the debian13
# Molecule scenario allows it in its own host_vars while the apt layer is built (TODO.md, section 5).
alpi_catalog_keys: [debian13, debian, deb, all]
packages_os: []

# MOK enrollment password (see group_vars/all/secureboot.yml)
mok_password: "debian-alpi"
# DKMS builds and signs the NVIDIA module (its own key, TODO.md Phase 3); VirtualBox's vboxdrv.sh
# signs with roles/virtualbox's key
kmod_signer: dkms

alpi_repos_always: []
alpi_repos_os:
  # Debian 13 has no VirtualBox package (catalog: virtualbox)
  virtualbox:
    type: deb822
    description: Oracle VirtualBox
    uris: https://download.virtualbox.org/virtualbox/debian
    suites: trixie
    components: contrib
    signed_by: https://www.virtualbox.org/download/oracle_vbox_2016.asc
