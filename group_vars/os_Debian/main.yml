---
# Debian 13 (PROPOSAL.md, "Decisions (2026-10-24)"). Shared with Ubuntu: group_vars/family_Debian
# (apt settings, repositories, GRUB, zram, full-update).
alpi_catalog_keys: [debian13, debian, deb, all]
packages_os: []

# MOK enrollment password (see group_vars/all/secureboot.yml)
mok_password: "debian-alpi"
# DKMS builds and signs the NVIDIA module (its key from roles/akmods_mok, kmod_signers in
# group_vars/all/secureboot.yml); VirtualBox's vboxdrv.sh signs with roles/virtualbox's key
kmod_signer: dkms

# Components roles/repos adds to Debian's own sources (steam-installer is in contrib, the NVIDIA
# driver and Intel's media driver in non-free, firmware in non-free-firmware)
apt_components: [main, contrib, non-free, non-free-firmware]

alpi_repos_always: []
alpi_repos_os:
  # Debian 13 has no VirtualBox package (catalog: virtualbox). Oracle's file and keyring names (see
  # group_vars/family_Debian/repos.yml)
  virtualbox:
    type: deb822
    description: Oracle VirtualBox
    file: virtualbox
    uris: https://download.virtualbox.org/virtualbox/debian
    suites: trixie
    components: contrib
    key_url: https://www.virtualbox.org/download/oracle_vbox_2016.asc
    keyring: /usr/share/keyrings/oracle-virtualbox-2016.gpg
