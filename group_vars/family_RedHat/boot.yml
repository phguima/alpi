---
# roles/boot on Fedora and EL: settings edited in /etc/default/grub itself, and the real config
# for both UEFI and BIOS regenerated (the ESP grub.cfg is a stub that loads it, and
# /etc/grub2-efi.cfg is only a symlink to it, missing on BIOS installs)
grub_regenerate: [grub2-mkconfig, -o, /boot/grub2/grub.cfg]
grub_dropin: ""
