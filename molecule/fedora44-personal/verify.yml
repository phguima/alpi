---
- name: Verify | Fedora 44, personal
  hosts: all
  tasks:
    - name: Verify | Resolution
      ansible.builtin.include_tasks: ../shared/verify_resolution.yml
      vars:
        _golden:
          native: [git, htop, zsh, vim, ShellCheck, 7zip, 7zip-standalone]
          flatpak: []
          extra: [tree]
          absent: [nano]
          unavailable: []
          features: {nvidia: false, asus: false, steam: true}

    - name: Verify | Packages
      ansible.builtin.include_tasks: ../shared/verify_packages.yml
      vars:
        _installed: [git, htop, zsh, vim-enhanced, ShellCheck, 7zip, 7zip-standalone, tree]
        _absent: [nano]
