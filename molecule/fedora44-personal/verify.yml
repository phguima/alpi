---
- name: Verify | Fedora 44, personal
  hosts: all
  tasks:
    - name: Verify | Installed
      ansible.builtin.include_tasks: ../shared/verify_installed.yml

    - name: Verify | Steam, ASUS (forced) and ClamAV features are on
      ansible.builtin.assert:
        that: alpi_feature.steam and alpi_feature.asus and alpi_feature.clamav
        quiet: true

    - name: Verify | selection.yml applied (Flatseal added without a desktop, Chromium skipped)
      ansible.builtin.assert:
        that:
          - "'flatseal' in alpi_pkgs.native"
          - "'chromium' not in alpi_pkgs.native"
          - "'com.slack.Slack' not in alpi_pkgs.flatpak"
        quiet: true

    # The real ASUS packages (COPR): the files roles/asus manages (supergfxd is skipped here)
    - name: Verify | Check the ASUS files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/asusd, /root/.config/autostart/rog-control-center.desktop]
      register: _asus

    - name: Verify | /etc/asusd and the ROG Control Center autostart entry exist
      ansible.builtin.assert:
        that: _asus.results | map(attribute='stat.exists') | list == [true, true]
        fail_msg: "{{ _asus.results | map(attribute='item') | list }}"
        quiet: true

    - name: Verify | Read the Flatpak override files
      ansible.builtin.slurp:
        src: "/root/.local/share/flatpak/overrides/{{ item }}"
      loop: [com.rtosta.zapzap, com.bitwarden.desktop]
      register: _overrides

    - name: Verify | Check for an override of the skipped app
      ansible.builtin.stat:
        path: /root/.local/share/flatpak/overrides/us.zoom.Zoom
      register: _zoom_override

    - name: Verify | Overrides applied to installed apps only
      ansible.builtin.assert:
        that:
          - "alpi_flatpak_overrides | map(attribute='app') | list == ['com.bitwarden.desktop', 'com.rtosta.zapzap']"
          - "'filesystems=/srv/wks:ro;' in _files['com.rtosta.zapzap']"
          - "'ALPI_TEST=1' in _files['com.bitwarden.desktop']"
          - not _zoom_override.stat.exists
        fail_msg: "{{ _files | to_json }}"
        quiet: true
      vars:
        _files: "{{ dict(_overrides.results | map(attribute='item') | zip(_overrides.results | map(attribute='content') | map('b64decode'))) }}"

    - name: Verify | Read root's .zshrc and login shell
      ansible.builtin.command: "{{ item }}"
      loop:
        - cat /root/.zshrc
        - getent passwd root
        - test -f /root/.oh-my-zsh/themes/kali-like-alt.zsh-theme
      register: _zsh
      changed_when: false

    # root is the user here (no SUDO_USER), so its block has the user aliases too
    - name: Verify | Zsh, theme, plugins and the aliases block (Fedora, LUKS, custom; no NVIDIA)
      ansible.builtin.assert:
        that:
          - _zsh.results[1].stdout.endswith(':/bin/zsh')
          - _zsh.results[2].rc == 0
          - "'ZSH_THEME=\"kali-like-alt\"' in _rc"
          - "'plugins=(git)' in _rc"
          - "'alias lls=' in _rc"
          - "'alias claudecli=' in _rc"
          - "'dnf needs-restarting\"' in _rc"
          - "'alias open-thevoid=\"udisksctl unlock -b /dev/disk/by-uuid/ad99f7e6-cf3a-4581-9c46-de99119b00d4; udisksctl mount -b /dev/mapper/luks-ad99f7e6-cf3a-4581-9c46-de99119b00d4\"' in _rc"
          - "'alias close-thevoid=' in _rc"
          - "'alias alpi-test=\"echo custom\"' in _rc"
          - "'nvidia-run' not in _rc"
          - _rc.count('# BEGIN ANSIBLE MANAGED ALIASES') == 1
        fail_msg: "{{ _rc }}"
        quiet: true
      vars:
        _rc: "{{ _zsh.results[0].stdout }}"

    - name: Verify | Read the git config
      ansible.builtin.command: git config --file /root/.gitconfig --list
      register: _git
      changed_when: false

    - name: Verify | Git identity and defaults set
      ansible.builtin.assert:
        that:
          - "'user.name=Test User' in _git.stdout_lines"
          - "'user.email=test@example.com' in _git.stdout_lines"
          - "'init.defaultbranch=main' in _git.stdout_lines"
          - "'pull.ff=only' in _git.stdout_lines"
        quiet: true
