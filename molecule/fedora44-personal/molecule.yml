---
# Fedora 44, personal profile: repos (RPM Fusion, Brave, VS Code, GitHub CLI, the ASUS COPR) and
# the packages role (base, real Flatpaks, extra, explicit uninstall). ASUS, Intel and AMD are forced
# through extra vars (they win over the detected facts) so the ASUS COPR, the Intel/AMD video
# packages and both swaps (ffmpeg, mesa-va-drivers-freeworld) are exercised.
platforms:
  - name: alpi-fedora44-personal
    image: registry.fedoraproject.org/fedora:44
    pre_build_image: true
    command: sleep infinity
provisioner:
  options:
    extra-vars: '{"is_nvidia": false, "is_asus": true, "is_intel": true, "is_amd": true}'
    # No systemd here: service roles are covered by the 'services' scenario. Setting skip-tags
    # replaces Molecule's default, so its own tags are repeated.
    skip-tags: molecule-notest,notest,clamav
