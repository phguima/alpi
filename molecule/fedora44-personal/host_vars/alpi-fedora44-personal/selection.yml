---
# As pick.py writes it: differences from the defaults. Flatseal is a GNOME package, listed by the
# picker only under GNOME; added here, it must be installed without a desktop.
packages_selection_add: [flatseal]
# The pipx apps are large (markitdown[all], notebooklm-py + Chromium): 'catalog' checks them on
# PyPI; a small pipx app from custom.yml goes through roles/pipx instead.
packages_selection_skip: [chromium, discord, drawy, displaycal, gpu-screen-recorder, markitdown,
                          notebooklm-py, pdf2docx]
features_selection: {}
