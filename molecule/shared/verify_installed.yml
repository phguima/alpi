---
# Everything the resolution selects must be installed, and packages_absent removed. Re-runs
# env_setup (resolution only) and checks with rpm --whatprovides, so provides count (vim ->
# vim-enhanced), or dpkg-query on apt (status "ii": installed, not just configured files left).
# Expected sets themselves are checked by the 'catalog' scenario.
- name: Verify | Resolve again
  ansible.builtin.include_tasks: ../../tasks/env_setup.yml

# The containers have no desktop session; KDE/GNOME here would mean the host's environment
# leaked in through a controller-side lookup.
- name: Verify | No desktop detected from the host
  ansible.builtin.assert:
    that: not is_kde and not is_gnome
    fail_msg: "Desktop detected in a container ({{ detected_xdg }}): host environment leaked"
    quiet: true

- name: Verify | Query native packages
  ansible.builtin.command:
    argv: "{{ ['rpm', '-q', '--whatprovides'] + [item] }}"
  loop: "{{ (alpi_pkgs.native + alpi_pkgs_extra.native + alpi_pkgs_absent.native) | reject('match', '@') }}"
  register: _rpm
  changed_when: false
  failed_when: false
  when: ansible_facts['pkg_mgr'] != 'apt'

- name: Verify | Query native packages (dpkg)
  ansible.builtin.command:
    argv: [dpkg-query, -W, "-f=${db:Status-Abbrev}", "{{ item }}"]
  loop: "{{ alpi_pkgs.native + alpi_pkgs_extra.native + alpi_pkgs_absent.native }}"
  register: _dpkg
  changed_when: false
  failed_when: false
  when: ansible_facts['pkg_mgr'] == 'apt'

# dnf groups ('@multimedia') are not packages: ask dnf about each one. dnf5's
# 'group list --installed' prints nothing even for installed groups; 'group info' is reliable.
- name: Verify | Query dnf groups
  ansible.builtin.command:
    argv: [dnf, -q, group, info, "{{ item | regex_replace('^@', '') }}"]
  environment:
    LC_ALL: C
  loop: "{{ (alpi_pkgs.native + alpi_pkgs_extra.native) | select('match', '@') | list }}"
  register: _groups
  when: ansible_facts['pkg_mgr'] != 'apt'
  changed_when: false
  failed_when: false

- name: Verify | List installed Flatpak apps
  ansible.builtin.command: flatpak list --app --columns=application
  register: _flatpak_list
  changed_when: false
  failed_when: false

- name: Verify | List the user's pipx apps
  ansible.builtin.command: pipx list --short
  become: true
  become_user: "{{ user_name }}"
  register: _pipx_list
  changed_when: false
  failed_when: false

- name: Verify | pipx apps installed, absent ones removed
  ansible.builtin.assert:
    that:
      - _wanted | difference(_have) | length == 0
      - _gone | intersect(_have) | length == 0
    fail_msg: "pipx list: {{ _have }}; wanted {{ _wanted }}, absent {{ _gone }}"
    quiet: true
  vars:
    _have: "{{ _pipx_list.stdout_lines | map('split') | map('first') | list }}"
    _wanted: "{{ (alpi_pkgs.pipx + alpi_pkgs_extra.pipx) | map('alpi_pipx_name') | list }}"
    _gone: "{{ alpi_pkgs_absent.pipx | map('alpi_pipx_name') | list }}"

- name: Verify | Selected packages installed, absent ones removed
  ansible.builtin.assert:
    that:
      - _missing | length == 0
      - _present | length == 0
      - _missing_flatpak | length == 0
      - _missing_groups | length == 0
    fail_msg: "Not installed: {{ _missing + _missing_flatpak + _missing_groups }}. Should be absent: {{ _present }}."
    quiet: true
  vars:
    _installed: >-
      {{ _rpm.results | selectattr('rc', 'defined') | selectattr('rc', 'eq', 0) | map(attribute='item') | list
         + _dpkg.results | selectattr('stdout', 'defined') | selectattr('stdout', 'match', 'ii') | map(attribute='item') | list }}
    _missing: "{{ (alpi_pkgs.native + alpi_pkgs_extra.native) | reject('match', '@') | difference(_installed) }}"
    _missing_groups: "{{ _groups.results | selectattr('stdout', 'defined') | rejectattr('stdout', 'search', '(?m)^Installed\\s*:\\s*yes') | map(attribute='item') | list }}"
    _present: "{{ alpi_pkgs_absent.native | intersect(_installed) }}"
    _missing_flatpak: "{{ (alpi_pkgs.flatpak + alpi_pkgs_extra.flatpak) | difference(_flatpak_list.stdout_lines | default([])) }}"

# Upstream sources (roles/upstream): the recorded version and the files are there, removed ones
# gone. github_fonts: a font directory with its .version; release_binary: an executable with
# its version in upstream_version_dir.
- name: Verify | Upstream fonts
  ansible.builtin.find:
    paths: "{{ upstream_sources[item].dest }}"
    hidden: true
  loop: "{{ _upstream_ids | select('in', _upstream_fonts) | list }}"
  register: _upstream_found
  vars:
    _upstream_ids: "{{ (alpi_pkgs.upstream + alpi_pkgs_extra.upstream + alpi_pkgs_absent.upstream) | unique }}"
    _upstream_fonts: "{{ upstream_sources | dict2items | selectattr('value.type', 'eq', 'github_fonts') | map(attribute='key') | list }}"

- name: Verify | Upstream fonts installed, absent ones removed
  ansible.builtin.assert:
    that: >-
      ((item.files | map(attribute='path') | map('basename') | select('eq', '.version') | list | length == 1
        and item.files | map(attribute='path') | select('match', '.*[.]ttf$') | list | length > 0)
       if item.item not in alpi_pkgs_absent.upstream else item.matched == 0)
    fail_msg: "{{ item.item }} in {{ upstream_sources[item.item].dest }}: {{ item.files | map(attribute='path') | list }}"
    quiet: true
  loop: "{{ _upstream_found.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Verify | Upstream programs
  ansible.builtin.stat:
    path: "{{ upstream_sources[item].dest }}"
  loop: "{{ _upstream_ids | select('in', _upstream_programs) | list }}"
  register: _upstream_program_found
  vars: &upstream_program_vars
    _upstream_ids: "{{ (alpi_pkgs.upstream + alpi_pkgs_extra.upstream + alpi_pkgs_absent.upstream) | unique }}"
    _upstream_programs: "{{ upstream_sources | dict2items | selectattr('value.type', 'eq', 'release_binary') | map(attribute='key') | list }}"

- name: Verify | Upstream program versions
  ansible.builtin.stat:
    path: "{{ upstream_version_dir }}/{{ item }}.version"
  loop: "{{ _upstream_ids | select('in', _upstream_programs) | list }}"
  register: _upstream_version_found
  vars: *upstream_program_vars

- name: Verify | Upstream programs installed (root, 0755, version recorded), absent ones removed
  ansible.builtin.assert:
    that: >-
      (item.0.stat.exists and item.0.stat.executable and item.0.stat.pw_name == 'root'
       and item.0.stat.mode == '0755' and item.1.stat.exists)
      if item.0.item not in alpi_pkgs_absent.upstream else
      (not item.0.stat.exists and not item.1.stat.exists)
    fail_msg: "{{ item.0.item }}: {{ upstream_sources[item.0.item].dest }} {{ item.0.stat }}, version file {{ item.1.stat.exists }}"
    quiet: true
  loop: "{{ _upstream_program_found.results | zip(_upstream_version_found.results) | list }}"
  loop_control:
    label: "{{ item.0.item }}"
