---
# Runs `site.yml --tags resolve` with the distro's own ansible-core inside the container (on EL10
# that is 2.16, older than Molecule's controller), with the same settings as the scenario.
- name: Verify | Install the distro's ansible-core
  ansible.builtin.package:
    name: ansible-core
    state: present

- name: Verify | Read this ansible-core's version
  ansible.builtin.command: python3 -c 'from ansible.release import __version__ as v; print(v)'
  register: _core
  changed_when: false

# Same pin as bootstrap.sh: community.general 12.x needs ansible-core 2.17+
- name: Verify | Install community.general for this ansible-core
  ansible.builtin.include_tasks: collections.yml
  vars:
    _collections_spec: "{{ 'community.general:>=11.0.0,<12.0.0' if _core.stdout is version('2.17', '<') else 'community.general' }}"

- name: Verify | Copy the project
  ansible.builtin.copy:
    src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/{{ item }}"
    dest: /opt/alpi/
    mode: preserve
  loop: [ansible.cfg, inventory.ini, site.yml, tasks, group_vars, filter_plugins, roles]

- name: Verify | Create the host_vars directory
  ansible.builtin.file:
    path: /opt/alpi/host_vars/127.0.0.1
    state: directory
    mode: "0755"

# The scenario's host_vars directory holds custom.yml and selection.yml, as on a real machine
- name: Verify | Copy the scenario settings
  ansible.builtin.copy:
    src: "host_vars/{{ inventory_hostname }}/"
    dest: /opt/alpi/host_vars/127.0.0.1/
    mode: "0644"

# The scenario's pinned hardware (Molecule extra vars) goes along, or this run would detect its own.
- name: Verify | Resolve with the native controller
  ansible.builtin.command:
    argv: [ansible-playbook, site.yml, --tags, resolve, -e, ansible_become=false, -e, "{{ _hardware | to_json }}"]
    chdir: /opt/alpi
  environment:
    ANSIBLE_BECOME_ASK_PASS: "False"
    ANSIBLE_NOCOLOR: "1"
  register: _native
  changed_when: false
  vars:
    _hardware: {is_nvidia: "{{ is_nvidia }}", is_asus: "{{ is_asus }}", is_intel: "{{ is_intel }}", is_amd: "{{ is_amd }}"}

- name: Verify | Native resolution matches the golden values
  ansible.builtin.assert:
    that: >-
      _summary.native == _golden.native and _summary.flatpak == _golden.flatpak
      and _summary.pipx == _golden.pipx and _summary.features == _golden.features
      and _summary.repos == _golden.repos
    fail_msg: "Expected {{ _golden | to_json }}, got {{ _summary | to_json }}"
    quiet: true
  vars:
    _summary: "{{ (_native.stdout | regex_search('\"msg\": (\\{[\\s\\S]*?\\n    \\})', '\\1') | first) | from_json }}"
