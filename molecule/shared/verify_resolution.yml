---
# Included by verify.yml with _golden: re-runs the resolution (env_setup only) and compares every
# resolved set with the expected one.
- name: Verify | Resolve again
  ansible.builtin.include_tasks: ../../tasks/env_setup.yml

- name: Verify | Resolution matches the golden values
  ansible.builtin.assert:
    that: _got == _golden
    fail_msg: "Expected {{ _golden }}, got {{ _got }}"
    quiet: true
  vars:
    _got:
      native: "{{ alpi_pkgs.native }}"
      swap: "{{ alpi_pkgs.swap }}"
      flatpak: "{{ alpi_pkgs.flatpak }}"
      pipx: "{{ alpi_pkgs.pipx }}"
      upstream: "{{ alpi_pkgs.upstream }}"
      extra: "{{ alpi_pkgs_extra.native + alpi_pkgs_extra.flatpak + alpi_pkgs_extra.pipx + alpi_pkgs_extra.upstream }}"
      absent: "{{ alpi_pkgs_absent.native + alpi_pkgs_absent.flatpak + alpi_pkgs_absent.pipx + alpi_pkgs_absent.upstream }}"
      unavailable: "{{ alpi_pkgs.unavailable + alpi_pkgs_extra.unavailable }}"
      features: "{{ alpi_feature }}"
      repos: "{{ alpi_repos_enabled | map(attribute='id') | list }}"
      flatpak_overrides: "{{ alpi_flatpak_overrides | map(attribute='app') | list }}"
