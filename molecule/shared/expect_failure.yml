---
# One failure case: runs env_setup (and the repos + packages roles when _case.packages_role is true) with
# the case's settings and passes only if it fails with a message containing every _case.expect.
# _case.broken_repo adds an unreachable repository for the duration of the case.
# _case.upstream_sources replaces upstream_sources for the case: through set_fact, saved and
# restored, since a block var could not fall back to the variable it shadows.
- name: "Case | {{ _case.name }}"
  vars:
    packages_add: "{{ _case.packages_add | default([]) }}"
    packages_skip: "{{ _case.packages_skip | default([]) }}"
    packages_absent: "{{ _case.packages_absent | default([]) }}"
    packages_selection_add: "{{ _case.packages_selection_add | default([]) }}"
    features_selection: "{{ _case.features_selection | default({}) }}"
    flatpak_overrides: "{{ _case.flatpak_overrides | default({}) }}"
    features: "{{ _case.features | default({}) }}"
    alpi_strict: "{{ _case.strict | default(false) }}"
    system_hostname: "{{ _case.system_hostname | default('') }}"
    git_user_email: "{{ _case.git_user_email | default('') }}"
    luks_volumes: "{{ _case.luks_volumes | default({}) }}"
  block:
    - name: "Case | {{ _case.name }} | Save upstream_sources"
      ansible.builtin.set_fact:
        _saved_upstream_sources: "{{ upstream_sources }}"
      when: _case.upstream_sources is defined

    - name: "Case | {{ _case.name }} | The case's upstream_sources"
      ansible.builtin.set_fact:
        upstream_sources: "{{ _case.upstream_sources }}"
      when: _case.upstream_sources is defined

    - name: "Case | {{ _case.name }} | Run env_setup"
      ansible.builtin.include_tasks: ../../tasks/env_setup.yml

    - name: "Case | {{ _case.name }} | Run the repos role"
      ansible.builtin.include_role:
        name: repos
      when: _case.packages_role | default(false)

    # After the repos role, which would trip on it first. skip_if_unavailable=0: dnf must not
    # ignore it (the default on both distros, made explicit).
    - name: "Case | {{ _case.name }} | Add a broken repository"
      ansible.builtin.copy:
        dest: /etc/yum.repos.d/alpi-broken.repo
        content: |
          [alpi-broken]
          name=ALPI test, unreachable on purpose
          baseurl=file:///nonexistent/alpi-broken
          enabled=1
          gpgcheck=0
          skip_if_unavailable=0
        mode: "0644"
      when: _case.broken_repo | default(false)
      # Test scaffolding, added and removed on every run: not a change under test (idempotence)
      changed_when: false

    - name: "Case | {{ _case.name }} | Run the packages role"
      ansible.builtin.include_role:
        name: packages
      when: _case.packages_role | default(false)

    - name: "Case | {{ _case.name }} | It should have failed"
      ansible.builtin.fail:
        msg: "Case '{{ _case.name }}' did not fail"
      register: _not_failed
  rescue:
    - name: "Case | {{ _case.name }} | Check the error message"
      ansible.builtin.assert:
        that:
          - _not_failed is not defined or _not_failed is not failed
          - _case.expect | select('in', ansible_failed_result.msg) | list == _case.expect
        fail_msg: "Expected {{ _case.expect }} in: {{ ansible_failed_result.msg }}"
        quiet: true
  always:
    - name: "Case | {{ _case.name }} | Restore upstream_sources"
      ansible.builtin.set_fact:
        upstream_sources: "{{ _saved_upstream_sources }}"
      when: _case.upstream_sources is defined

    - name: "Case | {{ _case.name }} | Remove the broken repository"
      ansible.builtin.file:
        path: /etc/yum.repos.d/alpi-broken.repo
        state: absent
      when: _case.broken_repo | default(false)
      changed_when: false
