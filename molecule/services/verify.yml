---
- name: Verify | Service roles
  hosts: all
  tasks:
    - name: Verify | Resolve again
      ansible.builtin.include_tasks: ../../tasks/env_setup.yml

    - name: Verify | Query the freshclam service
      ansible.builtin.command: systemctl is-enabled clamav-freshclam.service
      register: _enabled
      changed_when: false
      failed_when: false

    - name: Verify | Query whether it runs
      ansible.builtin.command: systemctl is-active clamav-freshclam.service
      register: _active
      changed_when: false
      failed_when: false

    - name: Verify | freshclam enabled and running
      ansible.builtin.assert:
        that:
          - alpi_feature.clamav
          - _enabled.stdout == 'enabled'
          - _active.stdout == 'active'
        fail_msg: "is-enabled: {{ _enabled.stdout }}, is-active: {{ _active.stdout }}"
        quiet: true
      when: inventory_hostname == 'alpi-svc-on'

    - name: Verify | Feature on, freshclam skipped - no unit, nothing enabled
      ansible.builtin.assert:
        that:
          - alpi_feature.clamav
          - "'clamav-freshclam' not in alpi_ids_base"
          - _enabled.rc != 0
        quiet: true
      when: inventory_hostname == 'alpi-svc-skip'
