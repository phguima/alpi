---
# debian13's verify.yml: the distro's own sources file, its components after roles/repos (all four
# were there), and packages that must have a candidate
_apt_sources: ubuntu.sources
_apt_components: main universe restricted multiverse
_apt_candidates: [brave-browser, code, gh, virtualbox-7.2, steam-installer, nvidia-driver-615-open,
                  linux-modules-nvidia-615-open-generic, "libnvidia-gl-615:i386", ubuntu-restricted-addons]

# Expected full resolved sets (verify.yml), reviewed 2026-10-25: Ubuntu 26.04 names checked with
# apt (main, restricted, universe, multiverse, Oracle's resolute); KDE, GNOME and all hardware
# forced on in molecule.yml. Against Debian's: Chromium as a Flatpak, Ubuntu's codecs
# (packages_os), the pinned NVIDIA branch with Canonical's modules (nothing built), generic headers.
_golden:
  native: [7zip, 7zip-standalone, curl, fastfetch, git, htop, hwinfo, imagemagick, lm-sensors, nodejs, nvtop, pipx,
    potrace, python3-pip, shellcheck, testdisk, tmux, tuptime, unrar, unzip, vim, wl-clipboard, zsh, fonts-firacode, fonts-roboto,
    ffmpeg, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, libheif-plugin-libde265,
    chkrootkit, lynis, rkhunter, unhide, argyll, brave-browser, brave-origin, gh, inkscape, code,
    ubuntu-restricted-addons, libavcodec-extra, kde-config-gtk-style, kpat, ktorrent, plasma-sdk, flatseal,
    gnome-tweaks, steam-installer, clamav, clamav-freshclam, virtualbox-7.2, linux-headers-generic, gcc, make,
    i965-va-driver, intel-media-va-driver-non-free, vainfo, vdpauinfo, nvidia-driver-615-open,
    linux-modules-nvidia-615-open-generic, "libnvidia-gl-615:i386", nvidia-vaapi-driver]
  # ffmpeg's entry-wide swap: harmless, the allowerasing install is dnf only
  swap: [ffmpeg]
  flatpak: [org.chromium.Chromium, com.discordapp.Discord, org.kde.drawy, org.telegram.desktop, com.bitwarden.desktop,
    net.displaycal.DisplayCAL, com.dec05eba.gpu_screen_recorder, com.slack.Slack, com.spotify.Client,
    com.rtosta.zapzap, us.zoom.Zoom, org.zotero.Zotero, org.gtk.Gtk3theme.Breeze, com.markopejic.downloader,
    com.mattjakeman.ExtensionManager, de.haeckerfelix.Fragments, com.github.unrud.VideoDownloader]
  pipx: [uv, "markitdown[all]", "notebooklm-py[browser]", pdf2docx]
  upstream: []
  extra: []
  absent: []
  unavailable: [gstreamer1-plugins-bad-free-extras, vlc-plugins-freeworld, asusctl, supergfxctl, asusctl-rog-gui,
    mesa-va-drivers-freeworld]
  features: {amd: true, antigravity_cli: true, antigravity_ide: true, asus: true, claude_code: true, clamav: true,
    intel: true, nvidia: true, steam: true, virtualbox: true}
  repos: [brave-browser, gh-cli, code, virtualbox]
  # KDE forced with KWin 6.6.6 (Kubuntu 26.04's): the cedilla layer is on
  flatpak_overrides: [com.rtosta.zapzap, com.bitwarden.desktop, us.zoom.Zoom, com.slack.Slack, com.spotify.Client]
  cedilla_xwayland: true
  groups: [family_Debian, os_Ubuntu, os_Ubuntu_26]
