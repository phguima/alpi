---
- name: Desktop | Guard against running on the host
  hosts: all
  gather_facts: false
  tasks:
    - name: Desktop | Require ALPI_TARGET
      ansible.builtin.assert:
        that: lookup('env', 'ALPI_TARGET') | length > 0
        fail_msg: ALPI_TARGET is not set; this scenario must target its containers. Set it in molecule.yml.
        quiet: true

# Play-level environment reaches fact gathering too: env_setup sees the sudo user and the desktop
- name: User | env_setup + roles/zsh + roles/desktop + roles/ai_tools + Flatpak overrides + reminders as user alpi
  hosts: all
  become: true
  environment:
    SUDO_USER: alpi
    XDG_CURRENT_DESKTOP: "{{ _desktop }}"
  # The AI tools' upstream: prepare.yml's local stand-ins
  vars:
    claude_install_script_url: http://127.0.0.1:8765/claude-install.sh
    antigravity_install_script_url: http://127.0.0.1:8765/agy-install.sh
    antigravity_ide_manifest_url: http://127.0.0.1:8765/manifest/latest-x64-linux.yml
  tasks:
    - name: Desktop | Environment setup
      ansible.builtin.import_tasks: ../../tasks/env_setup.yml

    # Stand-in for roles/update (a full upgrade is too heavy here): KWin 6.7.5 once side_effect.yml
    # has published it, then the cedilla decision again, as roles/update ends
    - name: User | Stand-in for the upgrade, KWin 6.7.5 when published (KDE)
      ansible.builtin.shell:
        cmd: |
          [ -e /root/alpi-kwin-published ] || exit 0
          rpm -q kwin-6.7.5 >/dev/null && exit 0
          rpm -U /opt/alpi-test/repo/noarch/kwin-6.7.5-1.noarch.rpm && echo upgraded
      register: _kwin_upgrade
      changed_when: "'upgraded' in _kwin_upgrade.stdout"
      when: _desktop == 'KDE'

    - name: User | Cedilla decision with the upgraded KWin
      ansible.builtin.import_tasks: ../../tasks/cedilla.yml

    - name: User | Zsh
      ansible.builtin.import_role:
        name: zsh

    - name: User | Desktop
      ansible.builtin.import_role:
        name: desktop

    # After zsh, as in site.yml: the Antigravity CLI's shell setup edits .zshrc
    - name: User | AI tools
      ansible.builtin.import_role:
        name: ai_tools

    # As in roles/packages; only KDE has flatpak (and the cedilla's Flatpak overrides)
    - name: User | Flatpak overrides (KDE)
      ansible.builtin.import_role:
        name: packages
        tasks_from: flatpak_overrides.yml
      when: _desktop == 'KDE'

    - name: User | Reminders
      ansible.builtin.import_tasks: ../../tasks/reminders.yml

    # For verify.yml (facts do not survive the converge): unset when gh is not selected
    - name: User | Record the gh login fact
      ansible.builtin.copy:
        content: "{{ alpi_gh_login_needed | default('unset') }}\n"
        dest: /root/alpi-gh-login-needed
        mode: "0644"

    - name: User | Record the final status banner
      ansible.builtin.copy:
        content: "{{ alpi_final_status.msg | join('\n') }}\n"
        dest: /root/alpi-final-status
        mode: "0644"

    - name: User | Record the cedilla fact
      ansible.builtin.copy:
        content: "{{ alpi_cedilla_xwayland }} {{ kwin_version }} {{ alpi_cedilla_flipped }}\n"
        dest: /root/alpi-cedilla-xwayland
        mode: "0644"
