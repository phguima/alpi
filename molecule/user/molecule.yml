---
# The user-specific roles (zsh, desktop) for a regular user, as on a real machine: the playbook
# runs as root with SUDO_USER=alpi (play-level environment, so env_setup's facts see it) and
# switches to alpi through sudo, so root and the user differ. Fedora 44, one container per
# desktop:
#   alpi-user-gnome: Ptyxis settings through a real session bus (dbus-daemon at
#                       /run/user/1000/bus, the role finds it from the uid); no Konsole files
#   alpi-user-kde:   Konsole profile, color scheme and konsolerc; no Ptyxis settings
# Both: ~/wks and the cedilla fix in ~/.XCompose, owned by the user. zsh: root gets the common
# aliases only, alpi everything; the API keys block (api_keys in host_vars, a vault in real use)
# goes to alpi only; the legacy blocks pre-seeded by prepare.yml are removed from both.
platforms:
  - name: alpi-user-gnome
    image: registry.fedoraproject.org/fedora:44
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-user-gnome:/var/cache/libdnf5"]
  - name: alpi-user-kde
    image: registry.fedoraproject.org/fedora:44
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-user-kde:/var/cache/libdnf5"]
provisioner:
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
