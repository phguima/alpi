---
_desktop: KDE
# In real use, from the vault (group_vars/all/secrets.yml)
api_keys: |
  export ALPI_TEST_KEY="secret"
# As in custom.yml: no Claude Code (the Antigravity CLI and IDE only), and NVIDIA vetoed
features: {claude_code: false, nvidia: false}
# The picker switched llsa off, custom.yml (applied last) turns it back on and ohmyzsh off
zsh_aliases_selection: {llsa: false}
zsh_aliases_enabled: {llsa: true, ohmyzsh: false}
