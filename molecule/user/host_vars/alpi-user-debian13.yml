---
# Test-only: Debian 13 allowed while the apt layer is built
alpi_supported: {Fedora: {min: 41, max: 44}, AlmaLinux: {min: 10, max: 10}, Debian: {min: 13, max: 13}}
_desktop: GNOME
# Debian's GNOME comes with gnome-terminal: no Ptyxis to set up or check
_test_ptyxis: false
# In real use, from the vault (group_vars/all/secrets.yml)
api_keys: |
  export ALPI_TEST_KEY="secret"
# As on the GNOME container: a root alias switched off in the picker
zsh_aliases_selection: {clean-cache: false}
