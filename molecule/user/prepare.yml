---
- name: Prepare | Shared
  ansible.builtin.import_playbook: ../shared/prepare.yml

- name: Prepare | A regular user and their desktop pieces
  hosts: all
  gather_facts: false
  tasks:
    # Ubuntu's image has its own user at uid 1000
    - name: Prepare | Remove the image's ubuntu user
      ansible.builtin.user:
        name: ubuntu
        state: absent
        remove: true
      when: inventory_hostname == 'alpi-user-ubuntu2604'

    - name: Prepare | User alpi (uid 1000)
      ansible.builtin.user:
        name: alpi
        uid: 1000

    # .zshrc as AFPI left it: its old NVIDIA/API block in both, the current API block in root's,
    # and an 'alias antigravity=' line for the Antigravity CLI stand-in to delete (alpi's only)
    - name: Prepare | Legacy .zshrc blocks
      ansible.builtin.copy:
        dest: "{{ item.home }}/.zshrc"
        owner: "{{ item.name }}"
        mode: "0644"
        content: |
          # export MANPATH="/usr/local/man:$MANPATH"
          # BEGIN NVIDIA AND API CONFIGURATION
          export ALPI_LEGACY_NVIDIA_BLOCK=1
          # END NVIDIA AND API CONFIGURATION
          alias antigravity="old alias, deleted by the Antigravity CLI's shell setup"
          {% if item.name == 'root' %}
          # BEGIN API CONFIGURATION
          export ALPI_ROOT_KEY=1
          # END API CONFIGURATION
          {% endif %}
      loop:
        - { name: root, home: /root }
        - { name: alpi, home: /home/alpi }
      loop_control:
        label: "{{ item.name }}"

    # The system Compose files (a desktop install has them)
    - name: Prepare | X11 compose files
      ansible.builtin.package:
        name: "{{ 'libx11-data' if 'apt' in group_names else 'libX11-common' }}"
        state: present

# gh logged in on GNOME and Debian (hosts.yml as gh writes it with the token in the keyring), not
# on KDE; gh skipped on EL (host_vars): no check there.
- name: Prepare | GitHub CLI login
  hosts: alpi-user-gnome:alpi-user-debian13
  gather_facts: false
  tasks:
    - name: Prepare | ~/.config/gh, alpi's
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: alpi
        mode: "0700"
      loop: [/home/alpi/.config, /home/alpi/.config/gh]

    - name: Prepare | ~/.config/gh/hosts.yml
      ansible.builtin.copy:
        dest: /home/alpi/.config/gh/hosts.yml
        owner: alpi
        mode: "0600"
        content: |
          github.com:
              git_protocol: https
              users:
                  alpi:
              user: alpi

# The cedilla step reads the system locale: pt_BR on GNOME (/etc/locale.conf) and Debian
# (/etc/default/locale, as Debian's installer writes it), none on the KDE container (fallback)
- name: Prepare | System locale
  hosts: alpi-user-gnome:alpi-user-debian13
  gather_facts: false
  tasks:
    - name: Prepare | /etc/locale.conf, or /etc/default/locale on Debian
      ansible.builtin.copy:
        dest: "{{ '/etc/default/locale' if 'apt' in group_names else '/etc/locale.conf' }}"
        content: |
          LANG={{ 'pt_BR.UTF-8' if 'apt' in group_names else '"pt_BR.UTF-8"' }}
        mode: "0644"

- name: Prepare | GNOME session bus
  hosts: alpi-user-gnome
  gather_facts: false
  tasks:
    - name: Prepare | Ptyxis, dconf and dbus-daemon
      ansible.builtin.package:
        name: [ptyxis, dconf, dbus-daemon]
        state: present

    # What pam_systemd creates at login
    - name: Prepare | Runtime directory
      ansible.builtin.file:
        path: /run/user/1000
        state: directory
        owner: alpi
        group: alpi
        mode: "0700"

    # Forked daemon: stdin/stdout detached or the exec never returns
    - name: Prepare | Session bus for alpi
      ansible.builtin.shell:
        cmd: >-
          dbus-daemon --session --address=unix:path=/run/user/1000/bus
          --fork </dev/null >/dev/null 2>&1
        creates: /run/user/1000/bus
      become: true
      become_user: alpi

# The AI tools' upstream, served locally on each container (converge.yml points the URLs here):
# the installer stand-ins, a stand-in AppImage and an update manifest in the real format (a .deb
# listed first, sha512 in base64 of the AppImage actually served)
- name: Prepare | Local stand-in for the AI tools' downloads
  hosts: all
  gather_facts: false
  tasks:
    - name: Prepare | Stand-in installers and AppImage
      ansible.builtin.copy:
        src: files/ai/
        dest: /srv/alpi-ai/
        mode: preserve

    - name: Prepare | Update manifest
      ansible.builtin.shell:
        cmd: |
          python3 - <<'PY'
          import base64, hashlib, pathlib
          root = pathlib.Path("/srv/alpi-ai")
          sha = base64.b64encode(hashlib.sha512((root / "Antigravity.AppImage").read_bytes()).digest()).decode()
          (root / "manifest").mkdir(exist_ok=True)
          (root / "manifest" / "latest-x64-linux.yml").write_text(
              "version: 9.9.9\nfiles:\n"
              f"  - url: http://127.0.0.1:8765/Antigravity.deb\n    sha512: {sha}\n"
              f"  - url: http://127.0.0.1:8765/Antigravity.AppImage\n    sha512: {sha}\n"
              f"path: Antigravity.AppImage\nsha512: {sha}\n")
          PY
        creates: /srv/alpi-ai/manifest/latest-x64-linux.yml

    # Detached like the session bus above, or the exec never returns
    - name: Prepare | HTTP server on 127.0.0.1:8765
      ansible.builtin.shell:
        cmd: >-
          setsid python3 -m http.server 8765 --bind 127.0.0.1 --directory /srv/alpi-ai
          </dev/null >/dev/null 2>&1 &
      changed_when: true

    - name: Prepare | Wait for the server
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8765
        timeout: 30

# Something run as root with alpi's HOME left the icon tree owned by root (seen on noir): the
# role must give it back to alpi
- name: Prepare | Root-owned icon directory
  hosts: alpi-user-gnome
  gather_facts: false
  tasks:
    - name: Prepare | ~/.local/share/icons, alpi's
      ansible.builtin.file:
        path: /home/alpi/.local/share/icons
        state: directory
        mode: "0755"
      become: true
      become_user: alpi

    - name: Prepare | ~/.local/share/icons/hicolor owned by root
      ansible.builtin.file:
        path: /home/alpi/.local/share/icons/hicolor
        state: directory
        owner: root
        group: root
        mode: "0755"

# User Steam launchers left behind: on GNOME and Debian, the copy ALPI wrote until 2026-10-25
# (every Exec with the offload); on KDE, AFPI's (only the main Exec rewritten); on EL, a launcher the user
# made, without the offload
- name: Prepare | Steam launchers
  hosts: all
  gather_facts: false
  tasks:
    - name: Prepare | The user's applications directory
      ansible.builtin.file:
        path: /home/alpi/.local/share/applications
        state: directory
        mode: "0755"
      become: true
      become_user: alpi

    - name: Prepare | User launcher
      ansible.builtin.copy:
        dest: /home/alpi/.local/share/applications/steam.desktop
        content: "{{ _content[inventory_hostname] | default(_content['alpi-user-gnome']) }}"
        mode: "0644"
      become: true
      become_user: alpi
      vars:
        _content:
          alpi-user-gnome: |
            [Desktop Entry]
            Name=Steam
            Exec=env __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia __NV_PRIME_RENDER_OFFLOAD_PROVIDER=NVIDIA-G0 /usr/bin/steam %U
            PrefersNonDefaultGPU=true
            X-KDE-RunOnDiscreteGpu=true

            [Desktop Action Store]
            Exec=env __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia __NV_PRIME_RENDER_OFFLOAD_PROVIDER=NVIDIA-G0 /usr/bin/steam steam://store
          alpi-user-kde: |
            [Desktop Entry]
            Name=Steam
            Exec=env __NV_PRIME_RENDER_OFFLOAD=1 __NV_PRIME_RENDER_OFFLOAD_PROVIDER=NVIDIA-G0 __GLX_VENDOR_LIBRARY_NAME=nvidia /usr/bin/steam %U
          alpi-user-el10: |
            [Desktop Entry]
            Name=My Steam
            Exec=/opt/steam/steam

# The cedilla on XWayland (KDE): a stand-in kwin package, 6.6.4 installed (the workaround applies)
# and 6.7.5 built for side_effect.yml (it no longer does); the system menu entries of Brave and VS
# Code (a trimmed copy of each); what AAPI and the user left behind: an AAPI copy of VS Code's URL
# handler (system entry plus the flag, no marker), the user's own VS Code entry, and Slack's
# override from AAPI plus a flag set by hand; Bitwarden's Wayland override from the KDE layer.
- name: Prepare | Cedilla on XWayland
  hosts: all
  gather_facts: false
  vars:
    _apps: /home/alpi/.local/share/applications
    _overrides: /home/alpi/.local/share/flatpak/overrides
  tasks:
    # Everywhere: GNOME and EL must leave them alone
    - name: Prepare | System menu entries of Brave and VS Code
      ansible.builtin.copy:
        src: files/xwayland/
        dest: /usr/share/applications/
        mode: "0644"

    - name: Prepare | KDE pieces
      when: inventory_hostname == 'alpi-user-kde'
      block:
        - name: Prepare | rpm-build and flatpak
          ansible.builtin.package:
            name: [rpm-build, flatpak]
            state: present

        - name: Prepare | Build directory
          ansible.builtin.file:
            path: /opt/alpi-test
            state: directory
            mode: "0755"

        - name: Prepare | kwin spec files
          ansible.builtin.copy:
            dest: "/opt/alpi-test/kwin-{{ item }}.spec"
            content: |
              Name: kwin
              Version: {{ item }}
              Release: 1
              Summary: ALPI test stand-in
              License: GPL-3.0-or-later
              BuildArch: noarch
              %description
              ALPI test stand-in for KWin.
              %files
            mode: "0644"
          loop: ["6.6.4", "6.7.5"]

        - name: Prepare | Build the kwin packages
          ansible.builtin.command:
            cmd: "rpmbuild -bb --define '_rpmdir /opt/alpi-test/repo' /opt/alpi-test/kwin-{{ item }}.spec"
            creates: "/opt/alpi-test/repo/noarch/kwin-{{ item }}-1.noarch.rpm"
          loop: ["6.6.4", "6.7.5"]

        - name: Prepare | Install kwin 6.6.4
          ansible.builtin.shell:
            cmd: rpm -q kwin || rpm -i /opt/alpi-test/repo/noarch/kwin-6.6.4-1.noarch.rpm
          changed_when: true

        - name: Prepare | AAPI's copy of the URL handler
          ansible.builtin.shell:
            cmd: >-
              sed 's|^Exec=/usr/share/code/code |Exec=/usr/share/code/code --ozone-platform=x11 |'
              /usr/share/applications/com.microsoft.VSCode.UrlHandler.desktop
              > {{ _apps }}/com.microsoft.VSCode.UrlHandler.desktop
            creates: "{{ _apps }}/com.microsoft.VSCode.UrlHandler.desktop"
          become: true
          become_user: alpi

        - name: Prepare | The user's own VS Code entry
          ansible.builtin.copy:
            dest: "{{ _apps }}/com.microsoft.VSCode.desktop"
            content: |
              [Desktop Entry]
              Name=My Code
              Exec=/opt/code/code --user-data-dir=/srv/code
              Type=Application
            mode: "0644"
          become: true
          become_user: alpi

        - name: Prepare | Overrides directory
          ansible.builtin.file:
            path: "{{ _overrides }}"
            state: directory
            mode: "0755"
          become: true
          become_user: alpi

        - name: Prepare | Slack's override from AAPI, and Bitwarden's from the KDE layer
          ansible.builtin.copy:
            dest: "{{ _overrides }}/{{ item.app }}"
            content: "{{ item.content }}"
            mode: "0644"
          become: true
          become_user: alpi
          loop:
            - app: com.slack.Slack
              content: |
                [Context]
                sockets=x11;!wayland;
                filesystems=/home/alpi/.XCompose:ro;

                [Environment]
                XDG_SESSION_TYPE=x11
                GTK_THEME=Breeze:dark
                ALPI_BY_HAND=1
            - app: com.bitwarden.desktop
              content: |
                [Context]
                sockets=wayland;fallback-x11;!x11;

                [Environment]
                XDG_CURRENT_DESKTOP=KDE
                GTK_USE_PORTAL=1
          loop_control:
            label: "{{ item.app }}"
