---
- name: Verify | roles/zsh and roles/desktop, root vs the user
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify | Files and their owners
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/alpi/wks
        - /home/alpi/.XCompose
        - /home/alpi/.local/share/konsole/kali-like-alt.profile
        - /home/alpi/.local/share/konsole/kali-like-alt.colorscheme
        - /home/alpi/.config/konsolerc
      register: _files

    - name: Verify | Read .XCompose and konsolerc
      ansible.builtin.command: "cat {{ item }}"
      loop: [/home/alpi/.XCompose, /home/alpi/.config/konsolerc]
      register: _content
      changed_when: false
      failed_when: false

    # The copied system Compose file, with the mapping applied, must be the expected locale's
    - name: Verify | Compose file of the expected locale
      ansible.builtin.shell: >-
        [ "$(sed 's/ć/ç/g; s/Ć/Ç/g; s/U0107/ccedilla/g; s/U0106/Ccedilla/g'
        /usr/share/X11/locale/{{ _expected }}/Compose)" = "$(cat /home/alpi/.XCompose)" ]
      vars:
        _expected: "{{ 'pt_BR.UTF-8' if _desktop == 'GNOME' else 'en_US.UTF-8' }}"
      changed_when: false

    - name: Verify | Workspace and cedilla for the user
      ansible.builtin.assert:
        that:
          - _files.results[0].stat.isdir and _files.results[0].stat.pw_name == 'alpi'
          - _files.results[1].stat.exists and _files.results[1].stat.pw_name == 'alpi'
          - "'ç' in _xcompose and 'ccedilla' in _xcompose"
          - "'ć' not in _xcompose and 'U0107' not in _xcompose"
        quiet: true
      vars:
        _xcompose: "{{ _content.results[0].stdout }}"

    - name: Verify | Konsole set up on KDE only
      ansible.builtin.assert:
        that: _konsole == ([true, true, true] if _desktop == 'KDE' else [false, false, false])
        fail_msg: "{{ _konsole | to_json }}"
        quiet: true
      vars:
        _konsole: "{{ _files.results[2:] | map(attribute='stat.exists') | list }}"

    - name: Verify | konsolerc settings (KDE)
      ansible.builtin.assert:
        that:
          - "'RememberWindowSize=false' in _rc"
          - "'DefaultProfile=kali-like-alt.profile' in _rc"
          - "'ExpandTabWidth=true' in _rc"
          - _files.results[4].stat.pw_name == 'alpi'
        fail_msg: "{{ _rc | to_json }}"
        quiet: true
      vars:
        _rc: "{{ _content.results[1].stdout_lines }}"
      when: _desktop == 'KDE'

    - name: Verify | Read the Ptyxis settings as alpi (GNOME)
      ansible.builtin.command: "{{ item }}"
      loop:
        - gsettings get org.gnome.Ptyxis default-columns
        - gsettings get org.gnome.Ptyxis restore-window-size
        - dconf read /org/gnome/Ptyxis/cursor-shape
        - dconf read /org/gnome/Ptyxis/font-name
      become: true
      become_user: alpi
      environment:
        XDG_RUNTIME_DIR: /run/user/1000
        DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
      register: _ptyxis
      changed_when: false
      when: _desktop == 'GNOME'

    - name: Verify | Ptyxis settings (GNOME)
      ansible.builtin.assert:
        that: _ptyxis.results | map(attribute='stdout') | list == ['uint32 120', 'false', "'underline'", "'Fira Code 10'"]
        fail_msg: "{{ _ptyxis.results | map(attribute='stdout') | list | to_json }}"
        quiet: true
      when: _desktop == 'GNOME'

    - name: Verify | Read both .zshrc files
      ansible.builtin.command: "cat {{ item }}"
      loop: [/root/.zshrc, /home/alpi/.zshrc]
      register: _zshrc
      changed_when: false

    - name: Verify | Root gets the common aliases only and no API keys
      ansible.builtin.assert:
        that:
          - "'alias lls=' in _root"
          - "'claudecli' not in _root and 'full-update' not in _root"
          - "'API CONFIGURATION' not in _root and 'ALPI_ROOT_KEY' not in _root"
          - "'NVIDIA AND API CONFIGURATION' not in _root"
        fail_msg: "{{ _root }}"
        quiet: true
      vars:
        _root: "{{ _zshrc.results[0].stdout }}"

    - name: Verify | The user gets every alias and the API keys block, no legacy block
      ansible.builtin.assert:
        that:
          - "'alias lls=' in _user and 'alias claudecli=' in _user and 'alias full-update=' in _user"
          # each layer's aliases start their own line (a folded join once wrote a literal
          # backslash-n between layers, putting them on the previous layer's last line)
          - _user.splitlines() | select('match', '^alias (lls|claudecli|full-update)=') | list | length == 3
          - _user.count('# BEGIN API CONFIGURATION') == 1
          - "'export ALPI_TEST_KEY=\"secret\"' in _user"
          - "'NVIDIA AND API CONFIGURATION' not in _user and 'ALPI_LEGACY_NVIDIA_BLOCK' not in _user"
        fail_msg: "{{ _user }}"
        quiet: true
      vars:
        _user: "{{ _zshrc.results[1].stdout }}"

- name: Verify | roles/ai_tools, for alpi only
  hosts: all
  gather_facts: false
  vars:
    # The features under test: defaults (all on), then the instance's host_vars
    _on: "{{ {'claude_code': true, 'antigravity_cli': true, 'antigravity_ide': true} | combine(features | default({})) }}"
    _apps: /home/alpi/.local/share/applications
    _icon_dir: /home/alpi/.local/share/icons/hicolor/512x512/apps
  tasks:
    - name: Verify | AI tools files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/alpi/.local/bin/claude
        - /home/alpi/.local/bin/agy
        - /home/alpi/wks/tools/antigravity/antigravity
        - "{{ _icon_dir }}/antigravity.png"
        - "{{ _apps }}/antigravity.desktop"
        - /root/.local/bin/claude
        - /root/.local/bin/agy
      register: _ai

    - name: Verify | Each tool installed for alpi exactly when its feature is on, never for root
      ansible.builtin.assert:
        that:
          - _exists == [_on.claude_code, _on.antigravity_cli] + [_on.antigravity_ide] * 3 + [false, false]
          - _ai.results[:5] | selectattr('stat.exists') | map(attribute='stat.pw_name') | unique | list
            in [['alpi'], []]
        fail_msg: "{{ _ai.results | map(attribute='stat.pw_name', default='-') | zip(_exists) | list | to_json }}"
        quiet: true
      vars:
        _exists: "{{ _ai.results | map(attribute='stat.exists') | list }}"

    # Each stand-in logs its runs: 'creates' keeps a second run away (idempotence checks the
    # task, this checks the installer itself ran only once over converge + idempotence)
    - name: Verify | Installer runs
      ansible.builtin.slurp:
        src: "/home/alpi/.alpi-installs-{{ item }}"
      loop: "{{ (['claude'] if _on.claude_code else []) + (['agy'] if _on.antigravity_cli else []) }}"
      register: _runs

    - name: Verify | Each installer ran once
      ansible.builtin.assert:
        that: _runs.results | map(attribute='content') | map('b64decode') | unique | list == ['run\n']
        quiet: true
      when: _runs.results | length > 0

    - name: Verify | Read alpi's and root's .zshrc
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/home/alpi/.zshrc, /root/.zshrc]
      register: _rc

    # The CLI's shell setup ran for alpi (stand-in: deletes 'alias antigravity='), after the
    # managed block, which keeps alias antigravity-ide; root's .zshrc is left alone
    - name: Verify | The Antigravity CLI's shell setup kept the managed aliases
      ansible.builtin.assert:
        that:
          - ('alias antigravity="' in _user) != _on.antigravity_cli
          - "'alias antigravity-ide=' in _user and 'alias agycli=' in _user"
          - "'alias antigravity=\"' in _root"
        fail_msg: "{{ _user }}"
        quiet: true
      vars:
        _user: "{{ _rc.results[0].content | b64decode }}"
        _root: "{{ _rc.results[1].content | b64decode }}"

    - name: Verify | Antigravity IDE
      when: _on.antigravity_ide
      block:
        - name: Verify | IDE directories and the served AppImage
          ansible.builtin.stat:
            path: "{{ item }}"
            checksum_algorithm: sha512
          loop:
            - /home/alpi/wks/tools/antigravity/antigravity
            - /srv/alpi-ai/Antigravity.AppImage
            - "{{ _apps }}"
            - /home/alpi/.local/share/icons/hicolor
            - /home/alpi/.local/share/icons/hicolor/512x512
            - "{{ _icon_dir }}"
          register: _ide

        - name: Verify | AppImage as served, executable; every icon level belongs to alpi
          ansible.builtin.assert:
            that:
              - _ide.results[0].stat.checksum == _ide.results[1].stat.checksum
              - _ide.results[0].stat.mode == '0755'
              - _ide.results[2:] | map(attribute='stat.pw_name') | unique | list == ['alpi']
            quiet: true

        - name: Verify | Read the icon, menu entry and mimeinfo.cache
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop:
            - "{{ _icon_dir }}/antigravity.png"
            - "{{ _apps }}/antigravity.desktop"
            - "{{ _apps }}/mimeinfo.cache"
          register: _ide_files

        - name: Verify | Icon extracted, menu entry, URL handler registered
          ansible.builtin.assert:
            that:
              - _ide_text[0] == 'PNG stand-in\n'
              - "'Exec=/home/alpi/wks/tools/antigravity/antigravity %U' in _ide_text[1]"
              - "'Icon=' ~ _icon_dir ~ '/antigravity.png' in _ide_text[1]"
              - "'MimeType=x-scheme-handler/antigravity;' in _ide_text[1]"
              - "'x-scheme-handler/antigravity=antigravity.desktop;' in _ide_text[2]"
            fail_msg: "{{ _ide_text | to_json }}"
            quiet: true
          vars:
            _ide_text: "{{ _ide_files.results | map(attribute='content') | map('b64decode') | list }}"

- name: Verify | Steam on the NVIDIA GPU (roles/desktop)
  hosts: all
  gather_facts: false
  vars:
    _steam_launcher: /home/alpi/.local/share/applications/steam.desktop
    _steam_prime: __NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia __NV_PRIME_RENDER_OFFLOAD_PROVIDER=NVIDIA-G0
  tasks:
    - name: Verify | The user's launcher
      ansible.builtin.stat:
        path: "{{ _steam_launcher }}"
      register: _steam

    - name: Verify | Read the launchers and the user's .zshrc
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: "{{ ([_steam_launcher] if _steam.stat.exists else []) + ['/home/alpi/.zshrc'] }}"
      register: _steam_files

    - name: Verify | Read the system launcher (GNOME)
      ansible.builtin.slurp:
        src: /usr/share/applications/steam.desktop
      register: _steam_system
      when: inventory_hostname == 'alpi-user-gnome'

    - name: Verify | GNOME launcher
      ansible.builtin.assert:
        that:
          - _steam.stat.pw_name == 'alpi'
          - _steam_user.splitlines() | select('match', '^Exec=') | reject('match', '^Exec=env ' ~ _steam_prime ~ ' /usr/bin/steam') | list == []
          - _steam_user.splitlines() | select('match', '^Exec=') | list | length == 4
          - _steam_user | replace('Exec=env ' ~ _steam_prime ~ ' ', 'Exec=') == _steam_sys
          - "'PrefersNonDefaultGPU=true' in _steam_user"
          - "'alias nvidia-run=\"' ~ _steam_prime ~ '\"' in _steam_rc"
        fail_msg: "{{ _steam_user }}"
        quiet: true
      vars:
        _steam_user: "{{ _steam_files.results[0].content | b64decode }}"
        _steam_sys: "{{ _steam_system.content | b64decode }}"
        _steam_rc: "{{ _steam_files.results[1].content | b64decode }}"
      when: inventory_hostname == 'alpi-user-gnome'

    - name: Verify | KDE (NVIDIA vetoed) lost AFPI's launcher; EL kept the user's own; no alias
      ansible.builtin.assert:
        that:
          - _steam.stat.exists == (inventory_hostname == 'alpi-user-el10')
          - not _steam.stat.exists or 'Name=My Steam' in (_steam_files.results[0].content | b64decode)
          - "'nvidia-run' not in (_steam_files.results[-1].content | b64decode)"
        quiet: true
      when: inventory_hostname != 'alpi-user-gnome'
