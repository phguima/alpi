---
- name: Verify | AlmaLinux 10, work
  hosts: all
  tasks:
    - name: Verify | Installed
      ansible.builtin.include_tasks: ../shared/verify_installed.yml

    - name: Verify | Steam stays out (feature off, and unavailable on EL even when added)
      ansible.builtin.assert:
        that:
          - not alpi_feature.steam
          - "'steam' in alpi_pkgs_extra.unavailable"
        quiet: true

    - name: Verify | Same resolution with EL10's ansible-core 2.16
      ansible.builtin.include_tasks: ../shared/verify_native_controller.yml
      vars:
        _golden:
          native: "{{ alpi_pkgs.native }}"
          flatpak: "{{ alpi_pkgs.flatpak }}"
          features: "{{ alpi_feature }}"
          repos: "{{ alpi_repos_enabled | map(attribute='id') | list }}"

    - name: Verify | Read the hostname and the git config
      ansible.builtin.command: "{{ item }}"
      loop:
        - cat /etc/hostname
        - git config --file /root/.gitconfig --list
      register: _out
      changed_when: false

    - name: Verify | Hostname untouched (work profile), only the git defaults set
      ansible.builtin.assert:
        that:
          - _out.results[0].stdout == 'alpi-el10-work'
          - _out.results[1].stdout_lines | select('match', 'user\\.') | list == []
          - "'init.defaultbranch=main' in _out.results[1].stdout_lines"
          - "'pull.ff=only' in _out.results[1].stdout_lines"
        quiet: true
