---
- name: Verify | AlmaLinux 10, work
  hosts: all
  tasks:
    - name: Verify | Installed
      ansible.builtin.include_tasks: ../shared/verify_installed.yml

    - name: Verify | Steam stays out (feature off in selection.yml, and unavailable on EL even when added)
      ansible.builtin.assert:
        that:
          - not alpi_feature.steam
          - "'steam' in alpi_pkgs_extra.unavailable"
        quiet: true

    - name: Verify | Skips from both selection.yml and custom.yml applied
      ansible.builtin.assert:
        that:
          - "'chromium' not in alpi_pkgs.native"
          - "'org.telegram.desktop' not in alpi_pkgs.flatpak"
          - "'com.slack.Slack' not in alpi_pkgs.flatpak"
          - "'com.rtosta.zapzap' not in alpi_pkgs.flatpak"
          - "'brave-browser' in alpi_pkgs.native"
        fail_msg: "native: {{ alpi_pkgs.native }}, flatpak: {{ alpi_pkgs.flatpak }}"
        quiet: true

    - name: Verify | Same resolution with EL10's ansible-core 2.16
      ansible.builtin.include_tasks: ../shared/verify_native_controller.yml
      vars:
        _golden:
          native: "{{ alpi_pkgs.native }}"
          flatpak: "{{ alpi_pkgs.flatpak }}"
          features: "{{ alpi_feature }}"
          repos: "{{ alpi_repos_enabled | map(attribute='id') | list }}"

    - name: Verify | NVIDIA left alone on EL (feature on, driver unavailable)
      ansible.builtin.stat:
        path: /etc/modprobe.d/nvidia.conf
      register: _nvidia_conf

    - name: Verify | No NVIDIA configuration, driver ids reported unavailable
      ansible.builtin.assert:
        that:
          - alpi_feature.nvidia
          - not _nvidia_conf.stat.exists
          - "'nvidia-driver' in alpi_pkgs.unavailable"
        quiet: true

    - name: Verify | Read the hostname and the git config
      ansible.builtin.command: "{{ item }}"
      loop:
        - cat /etc/hostname
        - git config --file /root/.gitconfig --list
      register: _out
      changed_when: false

    - name: Verify | Hostname untouched (none set), only the git defaults set
      ansible.builtin.assert:
        that:
          - _out.results[0].stdout == 'alpi-el10-work'
          - _out.results[1].stdout_lines | select('match', 'user\\.') | list == []
          - "'init.defaultbranch=main' in _out.results[1].stdout_lines"
          - "'pull.ff=only' in _out.results[1].stdout_lines"
        quiet: true
