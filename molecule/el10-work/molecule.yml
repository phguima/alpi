---
# AlmaLinux 10, work profile: resolution + the packages role, and the same resolution run by EL10's
# own ansible-core 2.16 inside the container (a real run uses it as the controller; Molecule's
# controller is the host's newer ansible-core).
# Repos: CRB, EPEL, RPM Fusion EL, Brave, VS Code, GitHub CLI. Flatpaks are covered by
# fedora44-personal and skipped here.
platforms:
  - name: alpi-el10-work
    image: docker.io/library/almalinux:10
    pre_build_image: true
    command: sleep infinity
provisioner:
  options:
    # Intel and AMD forced on: Intel's drivers install, AMD's packages are all unavailable on EL.
    extra-vars: '{"is_nvidia": false, "is_asus": false, "is_intel": true, "is_amd": true}'
