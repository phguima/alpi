---
# AlmaLinux 10, work machine (custom.yml + selection.yml): resolution + the packages role, and
# the same resolution run by EL10's own ansible-core 2.16 inside the container (a real run uses
# it as the controller; Molecule's controller is the host's newer ansible-core).
# Repos: CRB, EPEL, RPM Fusion EL, Brave, VS Code, GitHub CLI. Flatpaks are covered by
# fedora44-personal and skipped here.
platforms:
  - name: alpi-el10-work
    image: docker.io/library/almalinux:10
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-el10-work:/var/cache/dnf"]
provisioner:
  options:
    # Intel, AMD and NVIDIA forced on: Intel's drivers install; AMD's and NVIDIA's packages are
    # unavailable on EL, so roles/nvidia and roles/akmods_mok must do nothing.
    extra-vars: '{"is_nvidia": true, "is_asus": false, "is_intel": true, "is_amd": true}'
    # No systemd here: services are covered by the 'services' and 'asus' scenarios. Setting
    # skip-tags replaces Molecule's default, so its own tags are repeated.
    skip-tags: molecule-notest,notest,clamav,supergfxd
