---
- name: Failures | Each case must fail with its message
  hosts: all
  vars:
    _cases:
      - name: invalid hostname
        system_hostname: bad_name
        expect: ["Invalid machine settings", "system_hostname 'bad_name'"]
      - name: unknown package id
        packages_add: [nope, git]
        expect: ["Unknown package ids", "nope"]
      - name: installed and absent
        packages_absent: [git]
        expect: ["Both installed and in packages_absent: git"]
      # A selection.yml written before an id was removed from the catalog (pick.py drops those
      # on its next run)
      - name: unknown id in the selection
        packages_selection_add: [gone-from-catalog]
        expect: ["Unknown package ids", "gone-from-catalog"]
      - name: unknown feature in the selection
        features_selection: {old-feature: false}
        expect: ["Unknown features: old-feature"]
      - name: flatpak override flag without dashes
        flatpak_overrides: {com.bitwarden.desktop: [socket=wayland]}
        expect: ["Flatpak override flags must start with '--'", "com.bitwarden.desktop: socket=wayland"]
      - name: unknown feature
        features: {steamm: true}
        expect: ["Unknown features: steamm"]
      - name: invalid e-mail
        git_user_email: "no-at-sign"
        expect: ["Invalid machine settings", "git_user_email 'no-at-sign'"]
      - name: strict mode
        only: AlmaLinux
        packages_add: [steam]
        strict: true
        # The default set already has ids unavailable on EL (fonts, codecs, security, argyllcms)
        expect: ["Not available on AlmaLinux: google-roboto-fonts, gstreamer1-plugins-bad-free-extras,
                  chkrootkit, unhide, argyllcms, steam", "alpi_strict is on"]
      - name: names not found
        # Like a real run, repos first: every real name resolves, only the bad ones are reported
        packages_add: ["pkg:nope-xyz", "flatpak:org.nope.App"]
        packages_role: true
        expect: ["Native packages (not in any enabled repository): nope-xyz.",
                 "Flatpaks (not on Flathub): org.nope.App.", "none of the listed packages was installed"]
      - name: unreadable repository
        packages_role: true
        broken_repo: true
        expect: ["Could not read the repository metadata", "alpi-broken"]
  tasks:
    - name: Failures | Run the cases
      ansible.builtin.include_tasks: ../shared/expect_failure.yml
      loop: "{{ _cases | rejectattr('only', 'defined') + (_cases | selectattr('only', 'defined') | selectattr('only', 'eq', ansible_facts['distribution'])) }}"
      loop_control:
        loop_var: _case
        label: "{{ _case.name }}"
