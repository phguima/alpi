---
# Every validation must stop the run with a clear message (the assertions live in converge.yml).
# Fedora, AlmaLinux and Debian (the apt check: unknown names, unmet dependencies, a source apt
# cannot fetch); a case with 'only' runs on that distro alone.
platforms:
  - name: alpi-failures-fedora44
    image: registry.fedoraproject.org/fedora:44
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-failures-fedora44:/var/cache/libdnf5"]
  - name: alpi-failures-el10
    image: docker.io/library/almalinux:10
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-failures-el10:/var/cache/dnf"]
  - name: alpi-failures-debian13
    image: docker.io/library/debian:13
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-failures-debian13:/var/cache/apt"]
    groups: [apt]
provisioner:
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
scenario:
  test_sequence: [destroy, syntax, create, prepare, converge, idempotence, destroy]
