---
- name: Catalog | Repositories and name checks only
  hosts: all
  pre_tasks:
    - name: Catalog | Environment setup
      ansible.builtin.import_tasks: ../../tasks/env_setup.yml
  roles:
    - repos
  tasks:
    - name: Catalog | Check every name
      ansible.builtin.include_role:
        name: packages
        tasks_from: check.yml

    - name: Catalog | Check the AI tools' upstream URLs
      ansible.builtin.include_role:
        name: ai_tools
        tasks_from: check.yml
