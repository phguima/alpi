---
# Every catalog name must exist on every supported distro: repos role + the packages role's name
# checks (dnf dry run, Flathub lookup), with KDE, GNOME and all hardware (NVIDIA, ASUS, Intel, AMD) forced on so all lists are
# included. Installs nothing from the lists. verify.yml compares the full resolved sets.
platforms:
  - name: alpi-catalog-fedora44
    image: registry.fedoraproject.org/fedora:44
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-catalog-fedora44:/var/cache/libdnf5"]
  - name: alpi-catalog-el10
    image: docker.io/library/almalinux:10
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-catalog-el10:/var/cache/dnf"]
provisioner:
  options:
    # kwin_version: EL10's, so the cedilla's XWayland overrides are in the golden values
    extra-vars: '{"is_kde": true, "is_gnome": true, "is_nvidia": true, "is_asus": true, "is_intel": true, "is_amd": true, "kwin_version": "6.6.4"}'
  playbooks:
    converge: converge.yml
