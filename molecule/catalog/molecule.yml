---
# Every catalog name must exist on every supported distro: repos role + the packages role's name
# checks (dnf dry run, Flathub lookup), with KDE, GNOME and ASUS forced on so all lists are
# included. Installs nothing from the lists. verify.yml compares the full resolved sets.
platforms:
  - name: alpi-catalog-fedora44
    image: registry.fedoraproject.org/fedora:44
    pre_build_image: true
    command: sleep infinity
  - name: alpi-catalog-el10
    image: docker.io/library/almalinux:10
    pre_build_image: true
    command: sleep infinity
provisioner:
  options:
    extra-vars: '{"is_kde": true, "is_gnome": true, "is_asus": true}'
  playbooks:
    converge: converge.yml
