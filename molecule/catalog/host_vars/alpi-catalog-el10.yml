---
# Expected full resolved sets (verify.yml). Reviewed against AFPI 2.9 / AAPI 1.1 lists;
# KDE, GNOME and all hardware are forced on in molecule.yml.
_golden:
  native: [7zip, 7zip-standalone, curl, fastfetch, git, htop, hwinfo, ImageMagick, lm_sensors, nodejs, nvtop, pipx, potrace,
    python3-pip, ShellCheck, testdisk, tmux, tuptime, unrar, unzip, uv, vim-enhanced, zsh, fira-code-fonts,
    ffmpeg, gstreamer1-plugins-bad-freeworld, gstreamer1-plugins-ugly, gstreamer1-plugin-libav, lynis, rkhunter,
    brave-browser, brave-origin, chromium, discord, gh, code, kde-gtk-config, ktorrent, plasma-sdk, flatseal,
    gnome-tweaks, clamav, clamav-freshclam, VirtualBox-7.2, kernel-devel, gcc, make, elfutils-libelf-devel,
    libva-intel-driver, intel-media-driver]
  swap: [ffmpeg]
  flatpak: [org.kde.drawy, org.inkscape.Inkscape, org.telegram.desktop, com.bitwarden.desktop, net.displaycal.DisplayCAL, com.dec05eba.gpu_screen_recorder,
    com.slack.Slack, com.spotify.Client, com.rtosta.zapzap, us.zoom.Zoom, org.zotero.Zotero, org.kde.kpat, com.markopejic.downloader,
    com.mattjakeman.ExtensionManager, de.haeckerfelix.Fragments, com.github.unrud.VideoDownloader]
  features: {amd: true, antigravity_cli: true, antigravity_ide: true, asus: true, claude_code: true, clamav: true,
    intel: true, nvidia: true, steam: true, virtualbox: true}
  repos: [crb, epel, rpmfusion-free, rpmfusion-nonfree, brave, gh-cli, vscode, virtualbox-oracle]
  unavailable: [gstreamer1-plugins-bad-free-extras, chkrootkit, unhide, argyllcms, steam, asusctl,
    supergfxctl, asusctl-rog-gui, mesa-va-drivers-freeworld, libva-utils, vdpauinfo, nvidia-driver, nvidia-build,
    nvidia-vulkan, nvidia-vaapi]
  pipx: ["markitdown[all]", "notebooklm-py[browser]", pdf2docx]
  # Not packaged for EL: from its GitHub release (roles/upstream)
  upstream: [roboto]
  extra: []
  absent: []
  # KDE forced: the repository's KDE overrides, both apps selected
  flatpak_overrides: [com.bitwarden.desktop, us.zoom.Zoom]
