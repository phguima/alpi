---
- name: Common | Guard against running on the host
  hosts: all
  gather_facts: false
  tasks:
    - name: Common | Require ALPI_TARGET
      ansible.builtin.assert:
        that: lookup('env', 'ALPI_TARGET') | length > 0
        fail_msg: ALPI_TARGET is not set; this scenario must target its container. Set it in molecule.yml.
        quiet: true

- name: Common | env_setup + roles/common + roles/zsh (zsh skipped)
  hosts: all
  tasks:
    - name: Common | Environment setup
      ansible.builtin.import_tasks: ../../tasks/env_setup.yml

    - name: Common | Machine settings
      ansible.builtin.import_role:
        name: common

    - name: Common | Zsh (not selected here)
      ansible.builtin.import_role:
        name: zsh
