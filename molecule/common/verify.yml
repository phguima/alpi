---
- name: Verify | roles/common
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify | Read the static hostname and the git config
      ansible.builtin.command: "{{ item }}"
      loop:
        - cat /etc/hostname
        - hostnamectl --static
        - git config --file /root/.gitconfig --list
      register: _out
      changed_when: false

    - name: Verify | Check for Oh My Zsh and the login shell
      ansible.builtin.command: "{{ item }}"
      loop:
        - test -e /root/.oh-my-zsh
        - getent passwd root
      register: _zsh
      changed_when: false
      failed_when: false

    - name: Verify | zsh skipped - no Oh My Zsh, login shell unchanged
      ansible.builtin.assert:
        that:
          - _zsh.results[0].rc != 0
          - not _zsh.results[1].stdout.endswith('/zsh')
        quiet: true

    - name: Verify | Static hostname written, identity and defaults set
      ansible.builtin.assert:
        that:
          - _out.results[0].stdout == 'noir'
          - _out.results[1].stdout == 'noir'
          - "'user.name=O\\'Neil Test' in _out.results[2].stdout_lines"
          - "'user.email=oneil@example.com' in _out.results[2].stdout_lines"
          - "'init.defaultbranch=main' in _out.results[2].stdout_lines"
          - "'pull.ff=only' in _out.results[2].stdout_lines"
        quiet: true
