---
# roles/upstream on AlmaLinux 10 (no Roboto package), against stand-in forges served by
# python3 -m http.server in the container (prepare.yml: release JSON in the APIs' shape, zips
# with the real archive's traps: __MACOSX resource forks, unhinted copies, a non-font file; tea
# as Gitea publishes it, .xz + .sha256 next to a bare decoy; fj in a .tar.gz with a README):
#   alpi-up-install: installs v1 (only hinted/static/*.ttf, root-owned, version recorded; tea and
#                    fj in /usr/local/bin, root 0755, versions in /var/lib/alpi/upstream);
#                    side_effect.yml publishes v2 (a font dropped, one added; tea v2), deletes
#                    fj and runs again: fonts replaced wholesale, tea v2, fj v1 back
#   alpi-up-offline: the API does not answer: the installed versions stay, the run goes on
#   alpi-up-absent:  google-roboto-fonts, tea and forgejo-cli in packages_absent: removed
platforms:
  - name: alpi-up-install
    image: docker.io/library/almalinux:10
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-up-install:/var/cache/dnf"]
  - name: alpi-up-offline
    image: docker.io/library/almalinux:10
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-up-offline:/var/cache/dnf"]
  - name: alpi-up-absent
    image: docker.io/library/almalinux:10
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-up-absent:/var/cache/dnf"]
provisioner:
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
scenario:
  test_sequence: [destroy, syntax, create, prepare, converge, idempotence, side_effect, verify, destroy]
