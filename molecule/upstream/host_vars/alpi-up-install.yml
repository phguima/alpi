---
# The stand-in forges (prepare.yml); the rest as in group_vars/all/upstream.yml
upstream_sources:
  roboto:
    type: github_fonts
    release_api: http://127.0.0.1:8766/repos/googlefonts/roboto-3-classic/releases/latest
    asset: '[.]zip$'
    files: "hinted/static/*.ttf"
    dest: /usr/local/share/fonts/roboto
  tea:
    type: release_binary
    release_api: http://127.0.0.1:8766/api/v1/repos/gitea/tea/releases/latest
    asset: '^tea-[0-9.]+-linux-amd64[.]xz$'
    checksum_asset: '^tea-[0-9.]+-linux-amd64[.]xz[.]sha256$'
    dest: /usr/local/bin/tea
  forgejo-cli:
    type: release_binary
    release_api: http://127.0.0.1:8766/api/v1/repos/forgejo-contrib/forgejo-cli/releases/latest
    asset: '^forgejo-cli-x86_64-linux[.]tar[.]gz$'
    member: fj
    dest: /usr/local/bin/fj
