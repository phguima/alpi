---
- name: Verify | roles/upstream (Roboto on EL)
  hosts: all
  gather_facts: false
  vars:
    _up_dir: /usr/local/share/fonts/roboto
    _up_names: "{{ _up_found.files | map(attribute='path') | map('basename') | sort }}"
  tasks:
    - name: Verify | Font directory
      ansible.builtin.find:
        paths: "{{ _up_dir }}"
        hidden: true
      register: _up_found

    - name: Verify | Read the recorded version
      ansible.builtin.slurp:
        src: "{{ _up_dir }}/.version"
      register: _up_version
      failed_when: false

    - name: Verify | Installed v1 then replaced by v2 wholesale, hinted static TTFs only
      ansible.builtin.assert:
        that:
          - _up_names == ['.version', 'Roboto-Black.ttf', 'Roboto-Regular.ttf']
          - _up_version.content | b64decode == 'v2\n'
          - _up_found.files | map(attribute='pw_name') | unique | list == ['root']
          - _up_found.files | map(attribute='mode') | unique | list == ['0644']
        fail_msg: "{{ _up_names }} / {{ _up_found.files | map(attribute='mode') | list }}"
        quiet: true
      when: inventory_hostname == 'alpi-up-install'

    - name: Verify | Read an installed font
      ansible.builtin.slurp:
        src: "{{ _up_dir }}/Roboto-Regular.ttf"
      register: _up_font
      when: inventory_hostname == 'alpi-up-install'

    - name: Verify | The font is v2's hinted one
      ansible.builtin.assert:
        that: _up_font.content | b64decode == 'v2 Roboto-Regular\n'
        quiet: true
      when: inventory_hostname == 'alpi-up-install'

    - name: Verify | GitHub unreachable, the installed version stays
      ansible.builtin.assert:
        that:
          - _up_names == ['.version', 'Roboto-Regular.ttf']
          - _up_version.content | b64decode == 'v0\n'
        fail_msg: "{{ _up_names }}"
        quiet: true
      when: inventory_hostname == 'alpi-up-offline'

    - name: Verify | packages_absent removed the fonts
      ansible.builtin.stat:
        path: "{{ _up_dir }}"
      register: _up_stat
      when: inventory_hostname == 'alpi-up-absent'

    - name: Verify | Font directory gone
      ansible.builtin.assert:
        that: not _up_stat.stat.exists
        quiet: true
      when: inventory_hostname == 'alpi-up-absent'

- name: Verify | roles/upstream (tea and fj, release_binary)
  hosts: all
  gather_facts: false
  vars:
    _bin_expected:
      alpi-up-install: {tea: tea v2, fj: fj v1, tea_version: v2, fj_version: v1}
      alpi-up-offline: {tea: tea v0, fj: fj v0, tea_version: v0, fj_version: v0}
  tasks:
    - name: Verify | Programs and versions
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/usr/local/bin/tea, /usr/local/bin/fj, /var/lib/alpi/upstream/tea.version,
             /var/lib/alpi/upstream/forgejo-cli.version]
      register: _bin_stat

    - name: Verify | packages_absent removed the programs and their versions
      ansible.builtin.assert:
        that: _bin_stat.results | selectattr('stat.exists') | list | length == 0
        fail_msg: "{{ _bin_stat.results | selectattr('stat.exists') | map(attribute='item') | list }}"
        quiet: true
      when: inventory_hostname == 'alpi-up-absent'

    - name: Verify | Run the installed stand-ins
      ansible.builtin.command: "{{ item }}"
      loop: [/usr/local/bin/tea, /usr/local/bin/fj]
      register: _bin_run
      changed_when: false
      when: inventory_hostname != 'alpi-up-absent'

    - name: Verify | Read the recorded versions
      ansible.builtin.slurp:
        src: "/var/lib/alpi/upstream/{{ item }}.version"
      loop: [tea, forgejo-cli]
      register: _bin_versions
      when: inventory_hostname != 'alpi-up-absent'

    # install: tea updated to v2 from the .xz (not the bare decoy), fj put back at v1 from the
    # archive (not its README); offline: v0 kept
    - name: Verify | The expected programs, root 0755, versions recorded
      ansible.builtin.assert:
        that:
          - _bin_run.results | map(attribute='stdout') | list == [_exp.tea, _exp.fj]
          - _bin_versions.results | map(attribute='content') | map('b64decode') | list
            == [_exp.tea_version ~ '\n', _exp.fj_version ~ '\n']
          - _bin_stat.results[:2] | map(attribute='stat.pw_name') | unique | list == ['root']
          - _bin_stat.results[:2] | map(attribute='stat.mode') | unique | list == ['0755']
        fail_msg: >-
          {{ _bin_run.results | map(attribute='stdout') | list }}
          {{ _bin_versions.results | map(attribute='content') | map('b64decode') | list }}
          {{ _bin_stat.results[:2] | map(attribute='stat.mode') | list }}
        quiet: true
      vars:
        _exp: "{{ _bin_expected[inventory_hostname] }}"
      when: inventory_hostname != 'alpi-up-absent'
