---
- name: Unsupported | The distro is rejected
  hosts: all
  tasks:
    - name: Unsupported | Run the case
      ansible.builtin.include_tasks: ../shared/expect_failure.yml
      vars:
        _case:
          name: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
          expect:
            - "ALPI does not support {{ 'Debian 12' if 'debian12' in inventory_hostname else 'Ubuntu 26.10' }}"
            - "Supported: Fedora 41-44, AlmaLinux 10, Debian 13, Ubuntu 26.04"
