---
- name: Verify | NVIDIA and the akmods signing key
  hosts: all
  tasks:
    - name: Verify | Resolve again
      ansible.builtin.include_tasks: ../../tasks/env_setup.yml

    - name: Verify | Read the results
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/modprobe.d/nvidia.conf, /etc/pki/akmods/certs/public_key.der]
      register: _files

    - name: Verify | Read the fake mokutil log
      ansible.builtin.command: cat /var/log/fake-mokutil.log
      register: _mok_log
      changed_when: false
      failed_when: false

    - name: Verify | Driver selected and configured on both
      ansible.builtin.assert:
        that:
          - "'akmod-nvidia' in alpi_pkgs.native"
          - _files.results[0].stat.exists
        quiet: true

    - name: Verify | Secure Boot on, one enrollment request with the password
      ansible.builtin.assert:
        that:
          - is_secure_boot
          - _files.results[1].stat.exists
          - _mok_log.stdout_lines | select('match', '--import ') | list | length == 1
          - "'password: test-mok-pw / test-mok-pw' in _mok_log.stdout_lines"
        fail_msg: "mokutil log: {{ _mok_log.stdout_lines }}"
        quiet: true
      when: inventory_hostname == 'alpi-nvidia-sb'

    - name: Verify | Secure Boot off, no key and no mokutil call
      ansible.builtin.assert:
        that:
          - not is_secure_boot
          - not _files.results[1].stat.exists
          - _mok_log.rc != 0
        quiet: true
      when: inventory_hostname == 'alpi-nvidia-nosb'
