---
# Test-only: Debian 13 allowed while the apt layer is built
alpi_supported: {Fedora: {min: 41, max: 44}, AlmaLinux: {min: 10, max: 10}, Debian: {min: 13, max: 13}}
_test_swaps: ""
_test_zswap: "N"
zram_zswap_param: /etc/alpi-test/zswap

_expect_state: "on"
_expect_reminder: false
_expect_notes: []
_expect_installed: true
_expect_files:
  /etc/sysctl.d/99-alpi-zram.conf: ["vm.swappiness = 180", "vm.page-cluster = 0"]
_expect_absent:
  - /etc/systemd/zram-generator.conf
  - /etc/systemd/zram-generator.conf.d/50-alpi.conf
