---
- name: Boot | Guard against running on the host
  hosts: all
  gather_facts: false
  tasks:
    - name: Boot | Require ALPI_TARGET
      ansible.builtin.assert:
        that: lookup('env', 'ALPI_TARGET') | length > 0
        fail_msg: ALPI_TARGET is not set; this scenario must target its containers. Set it in molecule.yml.
        quiet: true

- name: Boot | env_setup + roles/boot
  hosts: all
  tasks:
    - name: Boot | Environment setup
      ansible.builtin.import_tasks: ../../tasks/env_setup.yml

    - name: Boot | Role
      ansible.builtin.import_role:
        name: boot
