---
- name: Secure Boot | Guard against running on the host
  hosts: all
  gather_facts: false
  tasks:
    - name: Secure Boot | Require ALPI_TARGET
      ansible.builtin.assert:
        that: lookup('env', 'ALPI_TARGET') | length > 0
        fail_msg: ALPI_TARGET is not set; this scenario must target its containers. Set it in molecule.yml.
        quiet: true

- name: Secure Boot | env_setup + roles/akmods_mok, virtualbox, nvidia
  hosts: all
  tasks:
    - name: Secure Boot | Environment setup
      ansible.builtin.import_tasks: ../../tasks/env_setup.yml

    - name: Secure Boot | akmods signing key
      ansible.builtin.import_role:
        name: akmods_mok

    - name: Secure Boot | VirtualBox
      ansible.builtin.import_role:
        name: virtualbox

    - name: Secure Boot | NVIDIA driver configuration
      ansible.builtin.import_role:
        name: nvidia
