---
- name: Verify | Personal machine on apt (debian13-personal, ubuntu2604-personal)
  hosts: all
  tasks:
    - name: Verify | Installed
      ansible.builtin.include_tasks: ../shared/verify_installed.yml

    # Debian 13's ansible-core 2.19, Ubuntu 26.04's 2.20: what bootstrap.sh installs there
    - name: Verify | Same resolution with the distro's own ansible-core
      ansible.builtin.include_tasks: ../shared/verify_native_controller.yml
      vars:
        _golden:
          native: "{{ alpi_pkgs.native }}"
          flatpak: "{{ alpi_pkgs.flatpak }}"
          pipx: "{{ alpi_pkgs.pipx }}"
          upstream: "{{ alpi_pkgs.upstream }}"
          features: "{{ alpi_feature }}"
          repos: "{{ alpi_repos_enabled | map(attribute='id') | list }}"

    - name: Verify | List the foreign architectures
      ansible.builtin.command: dpkg --print-foreign-architectures
      register: _deb_archs
      changed_when: false

    - name: Verify | Steam selected, so i386 is on and its 32-bit libraries are in
      ansible.builtin.assert:
        that:
          - "'steam-installer' in alpi_pkgs.native"
          - "'i386' in _deb_archs.stdout_lines"
        quiet: true

    # root is the user here (no SUDO_USER): its block has every alias, apt's full-update among them
    - name: Verify | Read root's .zshrc
      ansible.builtin.command: cat /root/.zshrc
      register: _deb_zshrc
      changed_when: false

    - name: Verify | zsh set up, with apt's full-update
      ansible.builtin.assert:
        that:
          - "'ZSH_THEME=\"kali-like-alt\"' in _deb_zshrc.stdout"
          - _deb_zshrc.stdout_lines | select('match', "^alias full-update='flatpak update -y; .*sudo apt full-upgrade -y;") | list | length == 1
          - "'alias lls=' in _deb_zshrc.stdout"
        fail_msg: "{{ _deb_zshrc.stdout }}"
        quiet: true
