---
# verify.yml (shared with ubuntu2604): the distro's own sources file, its components after
# roles/repos, and packages that must have a candidate
_apt_sources: debian.sources
_apt_components: main contrib non-free non-free-firmware
_apt_candidates: [brave-browser, code, gh, virtualbox-7.2, steam-installer, nvidia-driver, "nvidia-driver-libs:i386"]

# Expected full resolved sets (verify.yml), reviewed 2026-10-24: Debian 13 names checked with
# apt-cache (main, contrib, non-free); KDE, GNOME and all hardware forced on in molecule.yml.
_golden:
  native: [7zip, 7zip-standalone, curl, fastfetch, git, htop, hwinfo, imagemagick, lm-sensors, nodejs, nvtop, pipx,
    potrace, python3-pip, shellcheck, testdisk, tmux, tuptime, unrar, unzip, vim, wl-clipboard, zsh, fonts-firacode, fonts-roboto,
    ffmpeg, gstreamer1.0-plugins-bad, gstreamer1.0-plugins-ugly, gstreamer1.0-libav, libheif-plugin-libde265,
    chkrootkit, lynis, rkhunter, unhide, argyll, brave-browser, brave-origin, chromium, gh, inkscape, code,
    kde-config-gtk-style, kpat, ktorrent, plasma-sdk, flatseal, gnome-tweaks, steam-installer, clamav,
    clamav-freshclam, virtualbox-7.2, linux-headers-amd64, gcc, make, i965-va-driver, intel-media-va-driver-non-free,
    vainfo, vdpauinfo, nvidia-driver, "nvidia-driver-libs:i386", dkms, nvidia-vulkan-icd, nvidia-vaapi-driver]
  # ffmpeg's entry-wide swap: harmless, the allowerasing install is dnf only
  swap: [ffmpeg]
  flatpak: [com.discordapp.Discord, org.kde.drawy, org.telegram.desktop, com.bitwarden.desktop, net.displaycal.DisplayCAL,
    com.dec05eba.gpu_screen_recorder, com.slack.Slack, com.spotify.Client, com.rtosta.zapzap, us.zoom.Zoom,
    org.zotero.Zotero, org.gtk.Gtk3theme.Breeze, com.markopejic.downloader, com.mattjakeman.ExtensionManager,
    de.haeckerfelix.Fragments, com.github.unrud.VideoDownloader]
  pipx: [uv, "markitdown[all]", "notebooklm-py[browser]", pdf2docx]
  # The Gitea and Forgejo CLIs, from their releases everywhere (roles/upstream)
  upstream: [forgejo-cli, tea]
  extra: []
  absent: []
  unavailable: [gstreamer1-plugins-bad-free-extras, vlc-plugins-freeworld, asusctl, supergfxctl, asusctl-rog-gui,
    mesa-va-drivers-freeworld]
  features: {amd: true, antigravity_cli: true, antigravity_ide: true, asus: true, claude_code: true, clamav: true,
    intel: true, nvidia: true, steam: true, virtualbox: true}
  repos: [brave-browser, gh-cli, code, virtualbox]
  # KDE forced with KWin 6.3.6: the cedilla layer is on, as on EL10
  flatpak_overrides: [com.rtosta.zapzap, com.bitwarden.desktop, us.zoom.Zoom, com.slack.Slack, com.spotify.Client]
  cedilla_xwayland: true
  groups: [family_Debian, os_Debian, os_Debian_13]
