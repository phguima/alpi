---
- name: Debian 13 | Guard against running on the host
  hosts: all
  gather_facts: false
  tasks:
    - name: Debian 13 | Require ALPI_TARGET
      ansible.builtin.assert:
        that: lookup('env', 'ALPI_TARGET') | length > 0
        fail_msg: ALPI_TARGET is not set; this scenario must target its containers. Set it in molecule.yml.
        quiet: true

- name: Debian 13 | Environment setup, then the apt roles ported so far
  hosts: all
  tasks:
    - name: Debian 13 | Environment setup
      ansible.builtin.import_tasks: ../../tasks/env_setup.yml

    - name: Debian 13 | Repositories
      ansible.builtin.import_role:
        name: repos
