---
- name: Prepare | Shared
  ansible.builtin.import_playbook: ../shared/prepare.yml

# Debian installed with a root password: no sudo, and a first user outside any admin group
- name: Prepare | Debian without sudo
  hosts: alpi-bootstrap-debian13-nosudo
  gather_facts: false
  tasks:
    # sudo's prerm refuses while root has no password, unless told to
    - name: Prepare | Remove sudo
      ansible.builtin.apt:
        name: sudo
        state: absent
        purge: true
      environment:
        SUDO_FORCE_REMOVE: "yes"

    - name: Prepare | User alpi
      ansible.builtin.user:
        name: alpi
        shell: /bin/bash

# A first user with a password and sudo rights, as an installer makes it: the become test in
# converge runs the playbook's inventory and ansible.cfg as this user
- name: Prepare | Admin user with a password
  hosts: all:!alpi-bootstrap-debian13-nosudo
  gather_facts: false
  tasks:
    - name: Prepare | User alpi in the admin group
      ansible.builtin.user:
        name: alpi
        shell: /bin/bash
        groups: "{{ 'wheel' if 'fedora' in inventory_hostname else 'sudo' }}"
        append: true

    - name: Prepare | Password for alpi
      ansible.builtin.shell:
        cmd: echo 'alpi:alpi-test' | chpasswd
      changed_when: false
