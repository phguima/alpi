---
- name: Bootstrap | Run bootstrap.sh with scripted answers
  hosts: all:!alpi-bootstrap-debian13-nosudo
  vars:
    _dir: /opt/alpi
    _env:
      PATH: "/opt/shim:{{ ansible_facts['env']['PATH'] }}"
      # bootstrap.sh installs whiptail; the scripted answers need the picker's text prompts
      ALPI_PICKER: text
      # The copy of filter_plugins/ below brings the host's __pycache__; pick.py writing its own
      # alpi.cpython-3XX.pyc there (same name when host and container share a Python version)
      # would make that copy change on every run and fail idempotence
      PYTHONDONTWRITEBYTECODE: "1"
  tasks:
    # Debian has it in bsdutils, which every system has
    - name: Bootstrap | Install script(1)
      ansible.builtin.package:
        name: util-linux-script
        state: present
      when: ansible_facts['pkg_mgr'] != 'apt'

    - name: Bootstrap | Directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop: [/opt/shim, "{{ _dir }}/host_vars"]

    - name: Bootstrap | Pass-through sudo shim
      ansible.builtin.copy:
        dest: /opt/shim/sudo
        content: "#!/bin/sh\nexec \"$@\"\n"
        mode: "0755"

    - name: Bootstrap | Copy what bootstrap.sh reads
      ansible.builtin.copy:
        src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/{{ item }}"
        dest: "{{ _dir }}/"
        mode: preserve
      loop: [bootstrap.sh, pick.py, filter_plugins, site.yml, group_vars, custom.yml.example, inventory.ini, ansible.cfg]

    # bootstrap.sh still runs its 'ansible-galaxy collection install'; with the collection in place
    # it answers "Nothing to do" without contacting Galaxy.
    - name: Bootstrap | Install community.general from the controller's cache
      ansible.builtin.include_tasks: ../shared/collections.yml
      vars:
        _collections_spec: community.general

    - name: Bootstrap | Check for settings from an earlier run
      ansible.builtin.stat:
        path: "{{ _dir }}/host_vars/127.0.0.1/bootstrap.yml"
      register: _saved

    # AFPI/AAPI kept the settings in host_vars/127.0.0.1.yml; bootstrap.sh must move it. The
    # profile from an earlier ALPI must be dropped.
    - name: Bootstrap | Legacy settings file
      ansible.builtin.copy:
        dest: "{{ _dir }}/host_vars/127.0.0.1.yml"
        content: "system_hostname: old\ngit_user_name: \"O'Neil\"\nalpi_profile: personal\n"
        mode: "0644"
      when: not _saved.stat.exists

    # Invalid hostname and e-mail are asked again; '-' forgets the saved hostname. The picker
    # (text mode) rejects a line with an unknown id and applies nothing from it. +/- answers do
    # not depend on an earlier run (idempotence repeats this play).
    - name: Bootstrap | First run
      ansible.builtin.shell:
        cmd: >-
          printf 'bad_name\n-\nTest User\nnot-an-email\nt@example.com\n-steam\n-tmux nope\n-tmux\n\n'
          | script -qec ./bootstrap.sh /dev/null
        chdir: "{{ _dir }}"
      environment: "{{ _env }}"
      register: _run1
      changed_when: false
      # A prompt that lost its answer waits forever (apt reading the terminal did): fail instead
      timeout: 900

    - name: Bootstrap | First run asked again after the bad answers
      ansible.builtin.assert:
        that:
          - "\"Invalid hostname 'bad_name'\" in _run1.stdout"
          - "\"Invalid e-mail 'not-an-email'\" in _run1.stdout"
          - "'Unknown: nope. Nothing changed.' in _run1.stdout"
          # Only a real change is echoed: tmux is already off when idempotence repeats this
          - "_saved.stat.exists or 'tmux: off' in _run1.stdout"
          - "'Selection saved to' in _run1.stdout"
          - "not _saved.stat.exists or 'Moved host_vars/127.0.0.1.yml' not in _run1.stdout"
        fail_msg: "{{ _run1.stdout }}"
        quiet: true

    - name: Bootstrap | First run moved the legacy file
      ansible.builtin.assert:
        that: "'Moved host_vars/127.0.0.1.yml' in _run1.stdout"
        fail_msg: "{{ _run1.stdout }}"
        quiet: true
      when: not _saved.stat.exists

    # Enter keeps the saved git identity and the saved selection (Steam stays off); one more skip
    # and an alias off.
    - name: Bootstrap | Second run
      ansible.builtin.shell:
        cmd: printf 'noir\n\n\n-chkrootkit -clean-cache\n\n' | script -qec ./bootstrap.sh /dev/null
        chdir: "{{ _dir }}"
      environment: "{{ _env }}"
      register: _run2
      changed_when: false
      timeout: 900

    - name: Bootstrap | Second run saved the settings and the selection
      ansible.builtin.assert:
        that:
          - "'Settings saved to' in _run2.stdout"
          - "'2 skipped, features changed: steam=False; zsh aliases changed: clean-cache=False' in _run2.stdout"
        fail_msg: "{{ _run2.stdout }}"
        quiet: true

# become as a user with a password, through the repo's inventory.ini and ansible.cfg and the
# ansible-core bootstrap.sh installed. Ubuntu's sudo is sudo-rs, which wraps become's prompt so
# Ansible times out on it: the inventory must pick sudo.ws there, and plain sudo where it is absent.
- name: Bootstrap | become with a password
  hosts: all:!alpi-bootstrap-debian13-nosudo
  tasks:
    - name: Bootstrap | Run a become task as alpi
      ansible.builtin.command:
        cmd: >-
          su alpi -c "ANSIBLE_BECOME_ASK_PASS=False ansible all -m command -a id
          -e ansible_become_password=alpi-test"
        chdir: /opt/alpi
      register: _become
      changed_when: false
      failed_when: false

    - name: Bootstrap | Read the become executable the inventory picked
      ansible.builtin.command:
        cmd: su alpi -c "ansible all -m debug -a var=ansible_become_exe"
        chdir: /opt/alpi
      register: _become_exe
      changed_when: false

    - name: Bootstrap | Reached root, with sudo.ws on Ubuntu and sudo on Fedora
      ansible.builtin.assert:
        that:
          - _become.rc == 0
          - "'uid=0(root)' in _become.stdout"
          - "'ubuntu' not in inventory_hostname or '\"ansible_become_exe\": \"sudo.ws\"' in _become_exe.stdout"
          - "'fedora' not in inventory_hostname or '\"ansible_become_exe\": \"sudo\"' in _become_exe.stdout"
        fail_msg: "rc {{ _become.rc }}: {{ _become.stdout }} {{ _become.stderr }} / {{ _become_exe.stdout }}"
        quiet: true

# No sudo at all (Debian with a root password set at install): stop before anything is installed,
# with the command that fixes it. Run as alpi, as a user would.
- name: Bootstrap | Debian without sudo
  hosts: alpi-bootstrap-debian13-nosudo
  tasks:
    - name: Bootstrap | Copy what bootstrap.sh reads
      ansible.builtin.copy:
        src: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/{{ item }}"
        dest: /opt/alpi/
        mode: preserve
        owner: alpi
      loop: [bootstrap.sh, site.yml, group_vars]

    - name: Bootstrap | Run it as alpi
      ansible.builtin.command:
        cmd: su alpi -c ./bootstrap.sh
        chdir: /opt/alpi
      register: _nosudo
      changed_when: false
      failed_when: false

    - name: Bootstrap | Stopped with the su - command, nothing installed
      ansible.builtin.assert:
        that:
          - _nosudo.rc == 1
          - "'sudo is not installed' in _nosudo.stdout"
          - "'su - -c \"apt install sudo && usermod -aG sudo alpi\"' in _nosudo.stdout"
          - "'Installing ansible-core' not in _nosudo.stdout"
        fail_msg: "rc {{ _nosudo.rc }}: {{ _nosudo.stdout }} {{ _nosudo.stderr }}"
        quiet: true
