---
# bootstrap.sh end to end: installs ansible-core + community.general, moves the AFPI/AAPI-style
# host_vars/127.0.0.1.yml, asks the questions (bad answers are asked again) and writes
# host_vars/127.0.0.1/bootstrap.yml. The answers are piped through script(1), which gives the
# script a terminal; a pass-through sudo shim keeps the real sudo from swallowing them.
platforms:
  - name: alpi-bootstrap-fedora44
    image: registry.fedoraproject.org/fedora:44
    pre_build_image: true
    command: sleep infinity
    volumes: ["alpi-dnf-bootstrap-fedora44:/var/cache/libdnf5"]
provisioner:
  playbooks:
    converge: converge.yml
