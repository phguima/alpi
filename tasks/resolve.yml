---
# Package and feature resolution (PROPOSAL.md, "Customization"). Every check runs here, before
# any role changes the system. Results:
#   alpi_feature:    feature name -> bool (resolved first: features add package sets)
#   alpi_pkgs:       base set (repo defaults + distro + desktop + enabled features' packages +
#                    the picker's additions, minus the picker's and the user's skips)
#   alpi_pkgs_extra: the user's packages_add (installed in a separate step, after the base)
#   alpi_pkgs_absent: the user's packages_absent (explicit uninstall)
#   (each of the three: native, flatpak, pipx and upstream names, see alpi_resolve)
#   alpi_ids_selected: catalog ids that will be installed (base + extra, minus the unavailable):
#                    what roles gate their configuration on
#   alpi_repos_enabled: repository definitions to enable, in order (roles/repos)
#   alpi_flatpak_overrides: [{app, flags}] for the selected Flatpak apps (roles/packages)

- name: Resolve | Merge features
  ansible.builtin.set_fact:
    alpi_features_merged: "{{ features_default | combine(features_selection | default({}), features | default({})) }}"

- name: Resolve | Check feature names
  ansible.builtin.assert:
    that: _unknown | length == 0
    fail_msg: "Unknown features: {{ _unknown | join(', ') }}. Known: {{ features_default.keys() | join(', ') }}."
    quiet: true
  vars:
    _unknown: "{{ alpi_features_merged.keys() | difference(features_default.keys()) }}"

- name: Resolve | Set feature flags
  ansible.builtin.set_fact:
    alpi_feature: "{{ alpi_features_merged | alpi_features(alpi_hardware_features, {'nvidia': is_nvidia, 'asus': is_asus, 'intel': is_intel, 'amd': is_amd}) }}"

- name: Resolve | Select package ids
  ansible.builtin.set_fact:
    alpi_ids_base: >-
      {{ (packages_base + (packages_os | default([]))
          + (packages_kde if is_kde else []) + (packages_gnome if is_gnome else [])
          + (packages_selection_add | default([]))
          + (feature_packages | default({}) | alpi_feature_ids(alpi_feature)))
         | alpi_canonical(alpi_catalog_aliases) | unique
         | reject('in', packages_selection_skip | default([]) | alpi_canonical(alpi_catalog_aliases))
         | reject('in', packages_skip | default([]) | alpi_canonical(alpi_catalog_aliases)) | list }}
    alpi_ids_extra: >-
      {{ packages_add | default([]) | alpi_canonical(alpi_catalog_aliases) | unique
         | reject('in', packages_skip | default([]) | alpi_canonical(alpi_catalog_aliases)) | list }}
    alpi_ids_absent: "{{ packages_absent | default([]) | alpi_canonical(alpi_catalog_aliases) | unique }}"

- name: Resolve | Look up the catalog
  ansible.builtin.set_fact:
    alpi_pkgs: "{{ alpi_ids_base | alpi_resolve(alpi_catalog, alpi_catalog_keys, alpi_catalog_aliases) }}"
    alpi_pkgs_extra: "{{ alpi_ids_extra | reject('in', alpi_ids_base) | list | alpi_resolve(alpi_catalog, alpi_catalog_keys, alpi_catalog_aliases) }}"
    alpi_pkgs_absent: "{{ alpi_ids_absent | alpi_resolve(alpi_catalog, alpi_catalog_keys, alpi_catalog_aliases) }}"

- name: Resolve | Check package ids
  ansible.builtin.assert:
    that:
      - _unknown | length == 0
      - _missing | length == 0
      - _conflict | length == 0
    fail_msg: "{{ _messages | select | join(' ') }}"
    quiet: true
  vars:
    _unknown: "{{ alpi_pkgs.unknown + alpi_pkgs_extra.unknown + alpi_pkgs_absent.unknown }}"
    _missing: "{{ alpi_pkgs.missing + alpi_pkgs_extra.missing + alpi_pkgs_absent.missing }}"
    _conflict: "{{ (alpi_ids_base + alpi_ids_extra) | intersect(alpi_ids_absent) }}"
    _messages:
      - "{{ ('Unknown package ids (not in group_vars/all/catalog.yml; use pkg:<name> or flatpak:<app id> for names outside the catalog): ' ~ _unknown | join(', ') ~ '.') if _unknown else '' }}"
      - "{{ ('Catalog bug, no entry for this distro (keys ' ~ alpi_catalog_keys | join(', ') ~ '): ' ~ _missing | join(', ') ~ '.') if _missing else '' }}"
      - "{{ ('Both installed and in packages_absent: ' ~ _conflict | join(', ') ~ '.') if _conflict else '' }}"

# Catalog values {upstream: <id>} name a source in upstream_sources (group_vars/all/upstream.yml)
- name: Resolve | Check upstream sources
  ansible.builtin.assert:
    that: _unknown | length == 0
    fail_msg: >-
      Catalog bug, upstream sources with no definition (upstream_sources in
      group_vars/all/upstream.yml): {{ _unknown | join(', ') }}.
    quiet: true
  vars:
    _unknown: "{{ (alpi_pkgs.upstream + alpi_pkgs_extra.upstream + alpi_pkgs_absent.upstream) | unique | difference(upstream_sources | default({}) | list) }}"

- name: Resolve | Set the selected ids
  ansible.builtin.set_fact:
    alpi_ids_selected: >-
      {{ (alpi_ids_base + alpi_ids_extra)
         | reject('in', alpi_pkgs.unavailable + alpi_pkgs_extra.unavailable) | list }}

- name: Resolve | Check unavailable packages (strict mode)
  ansible.builtin.assert:
    that: _unavailable | length == 0
    fail_msg: "Not available on {{ ansible_facts['distribution'] }}: {{ _unavailable | join(', ') }} (alpi_strict is on)."
    quiet: true
  vars:
    _unavailable: "{{ alpi_pkgs.unavailable + alpi_pkgs_extra.unavailable }}"
  when: alpi_strict | bool

- name: Resolve | Select repositories
  ansible.builtin.set_fact:
    _repos: >-
      {{ (alpi_repos_common | default({})) | combine(alpi_repos_os | default({}))
         | alpi_repos(alpi_repos_always | default([]), alpi_pkgs.repos + alpi_pkgs_extra.repos) }}

- name: Resolve | Check repository ids
  ansible.builtin.assert:
    that: _repos.unknown | length == 0
    fail_msg: >-
      Catalog bug, repositories with no definition for {{ ansible_facts['distribution'] }}
      (alpi_repos_common / alpi_repos_os): {{ _repos.unknown | join(', ') }}.
    quiet: true

- name: Resolve | Set repositories
  ansible.builtin.set_fact:
    alpi_repos_enabled: "{{ _repos.enabled }}"

- name: Resolve | Select Flatpak overrides
  ansible.builtin.set_fact:
    _overrides: >-
      {{ [flatpak_overrides_kde | default({}) if is_kde else {}, flatpak_overrides | default({})]
         | alpi_flatpak_overrides(flatpak_filesystem_overrides | default({}),
                                  alpi_pkgs.flatpak + alpi_pkgs_extra.flatpak) }}

- name: Resolve | Check Flatpak override flags
  ansible.builtin.assert:
    that: _overrides.invalid | length == 0
    fail_msg: >-
      Flatpak override flags must start with '--' (flatpak_overrides in
      host_vars/127.0.0.1/custom.yml; folders go in flatpak_filesystem_overrides):
      {{ _overrides.invalid | join(', ') }}.
    quiet: true

- name: Resolve | Set Flatpak overrides
  ansible.builtin.set_fact:
    alpi_flatpak_overrides: "{{ _overrides.apply }}"

- name: Resolve | Summary
  ansible.builtin.debug:
    msg:
      distro: "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
      desktop: "{{ 'KDE' if is_kde else ('GNOME' if is_gnome else 'none detected') }}"
      native: "{{ alpi_pkgs.native }}"
      flatpak: "{{ alpi_pkgs.flatpak }}"
      pipx: "{{ alpi_pkgs.pipx }}"
      upstream: "{{ alpi_pkgs.upstream }}"
      extra: "{{ alpi_pkgs_extra.native + alpi_pkgs_extra.flatpak + alpi_pkgs_extra.pipx + alpi_pkgs_extra.upstream }}"
      absent: "{{ alpi_pkgs_absent.native + alpi_pkgs_absent.flatpak + alpi_pkgs_absent.pipx + alpi_pkgs_absent.upstream }}"
      unavailable_skipped: "{{ alpi_pkgs.unavailable + alpi_pkgs_extra.unavailable }}"
      features: "{{ alpi_feature }}"
      repos: "{{ alpi_repos_enabled | map(attribute='id') }}"
      flatpak_overrides: "{{ alpi_flatpak_overrides | map(attribute='app') }}"
