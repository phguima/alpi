---
# End-of-run reminders for steps the playbook cannot do itself (ported from AFPI/AAPI's
# post_tasks).

# gh login is interactive (browser + token in the keyring), so the playbook only reminds.
# hosts.yml lists the logged-in hosts even when the token itself lives in the keyring, and reading
# it does not need the user's D-Bus session (gh auth status run through sudo would).
- name: GitHub CLI | Check login
  when: "'gh' in alpi_ids_selected and user_name != 'root'"
  block:
    - name: GitHub CLI | Read the logged-in hosts
      ansible.builtin.slurp:
        src: "{{ user_home }}/.config/gh/hosts.yml"
      register: _gh_hosts
      failed_when: false

    - name: GitHub CLI | Set the login fact
      ansible.builtin.set_fact:
        alpi_gh_login_needed: "{{ 'github.com:' not in (_gh_hosts.content | default('') | b64decode) }}"

    - name: GitHub CLI | Remind to log in
      ansible.builtin.debug:
        msg:
          - "The GitHub CLI is not logged in. As {{ user_name }}, run:"
          - "  gh auth login --hostname github.com --git-protocol https --web"
          - "  gh auth setup-git"
      when: alpi_gh_login_needed

# roles/memory reports it (alpi_memory); a skipped role leaves it undefined
- name: Memory | Remind about disk swap for hibernation
  ansible.builtin.debug:
    msg:
      - "hibernate is on, but the disk swap ({{ (alpi_memory.disk | sum(attribute='size') / 2**30) | round(1) }} GiB) is smaller than RAM ({{ _ram_gib }} GiB); zram cannot hold a hibernation image. A swap file of {{ _ram_gib }} GiB:"
      - "  btrfs: btrfs subvolume create /swap && btrfs filesystem mkswapfile --size {{ _ram_gib }}g /swap/swapfile"
      - "  xfs/ext4: fallocate -l {{ _ram_gib }}G /swapfile && chmod 600 /swapfile && mkswap /swapfile"
      - "then 'swapon /swapfile' (or /swap/swapfile), the same path in /etc/fstab ('<path> none swap defaults,pri=10 0 0', below zram's 100), and resume from it (kernel argument resume=)."
  vars:
    _ram_gib: "{{ (ansible_facts['memtotal_mb'] / 1024) | round(0, 'ceil') | int }}"
  when: alpi_memory is defined and alpi_memory.hibernate_reminder
