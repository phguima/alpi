---
# Master playbook for ALPI (Ansible Linux Post-Install)
# Golden test (no changes to the system): ansible-playbook site.yml --tags resolve

- name: ALPI | Linux Post-Install
  # Molecule sets ALPI_TARGET=all to run against its containers; a real run targets localhost.
  hosts: "{{ lookup('env', 'ALPI_TARGET') | default('localhost', true) }}"
  become: yes

  pre_tasks:
    - name: ALPI | Environment Setup
      ansible.builtin.import_tasks: tasks/env_setup.yml
      tags: [always]

  roles:
    - { role: repos, tags: [repos] }
    # Upgrade + reboot gate: before anything builds kernel modules or installs packages
    - { role: update, tags: [update] }
    # After the reboot gate: the running kernel is the newest, older ones can go
    - { role: boot, tags: [boot] }
    # Before packages: module signing keys must exist before akmods/vboxdrv build anything
    - { role: akmods_mok, tags: [akmods_mok, secureboot] }
    - { role: virtualbox, tags: [virtualbox] }
    - { role: packages, tags: [packages] }
    - { role: common, tags: [common] }
    - { role: zsh, tags: [zsh] }
    - { role: desktop, tags: [desktop] }
    # After zsh: 'pipx ensurepath' finds the user's .zshrc
    - { role: pipx, tags: [pipx] }
    # After zsh: the Antigravity CLI's shell setup edits the user's .zshrc
    - { role: ai_tools, tags: [ai_tools] }
    - { role: clamav, tags: [clamav] }
    - { role: asus, tags: [asus] }
    - { role: nvidia, tags: [nvidia] }
