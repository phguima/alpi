[localhost]
# Ubuntu's sudo (25.10+) is sudo-rs, which wraps become's password prompt in its own
# ("[sudo: <prompt>] Password:"), so Ansible never sees it and times out. Ubuntu still ships the
# classic sudo as sudo.ws: use it where it exists (controller and target are this machine).
127.0.0.1 ansible_connection=local ansible_become_exe="{{ 'sudo.ws' if '/usr/bin/sudo.ws' is file else 'sudo' }}"
